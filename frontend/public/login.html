<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTshop — Kirish</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --accent: #6c5ce7;
    --accent-2: #a29bfe;
    --text: #f1f2f6;
    --muted: #8a8d98;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #1c1f2a, var(--bg));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--card);
    border-radius: 20px;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.05);
  }
  .logo-img {
    display: block;
    width: 96px;
    height: 96px;
    margin: 0 auto 4px;
    border-radius: 18px;
    object-fit: cover;
  }
  .sub {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 28px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin: 16px 0 6px;
  }
  input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    background: #1f232e;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #5847c9);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:active { opacity: 0.8; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error {
    color: var(--error);
    font-size: 13px;
    text-align: center;
    margin-top: 14px;
    min-height: 16px;
  }
  .hint {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 20px;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="logo.jpg" alt="MTshop" class="logo-img">
    <div class="sub">Hisobingizga kiring</div>

    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" required>

      <label for="password">Parol</label>
      <input type="password" id="password" autocomplete="current-password" required>

      <div class="error" id="errorMsg"></div>

      <button type="submit" id="submitBtn">Kirish</button>
    </form>

    <div class="hint">Hisobingiz yo'qmi? Admin bilan bog'laning.</div>
  </div>

  <script src="config.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Kirilmoqda...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          errorMsg.textContent = data.error || 'Xatolik yuz berdi';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Kirish';
          return;
        }
        window.location.href = 'index.html';
      } catch (err) {
        errorMsg.textContent = 'Serverga ulanib bo\'lmadi';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Kirish';
      }
    });
  </script>
</body>
</html>
