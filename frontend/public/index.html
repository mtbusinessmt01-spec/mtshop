<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTshop — Liquid Glass</title>
<!-- MTshop Liquid Glass v2: 3-item navigation + elastic active glass indicator -->
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --accent: #6c5ce7;
    --accent-2: #a29bfe;
    --text: #f1f2f6;
    --muted: #8a8d98;
    --coin: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #app { display: none; flex-direction: column; height: 100vh; }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  header .brand { font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  header .logo-icon { width: 28px; height: 28px; border-radius: 8px; object-fit: cover; vertical-align: middle; }
  header .brand span { color: var(--accent-2); }
  .coin-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #1f232e;
    padding: 8px 14px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 14px;
  }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 18px 110px;
  }
  .page-title { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
  .page-sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .section-title { font-weight: 700; font-size: 15px; margin-bottom: 12px; }
  .type-tabs { display: flex; gap: 8px; }
  .type-tab {
    flex: 1; padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08);
    background: #1f232e; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .type-tab.active { background: linear-gradient(135deg, var(--accent), #5847c9); color: white; border-color: transparent; }
  .send-label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 6px; }
  .send-input {
    width: 100%; padding: 11px 12px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.08); background: #1f232e; color: var(--text); font-size: 14px;
  }
  .send-hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .msg { font-size: 13px; margin-top: 10px; }
  .msg.error { color: #ff6b6b; }
  .msg.success { color: #6bcB77; }
  .placeholder {
    background: var(--card);
    border-radius: 16px;
    padding: 32px 20px;
    text-align: center;
    color: var(--muted);
    border: 1px dashed rgba(255,255,255,0.1);
  }
  nav {
    position: fixed;
    bottom: calc(14px + env(safe-area-inset-bottom)); left: 14px; right: 14px;
    background: rgba(23,26,33,0.72);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    display: flex;
    justify-content: space-around;
    padding: 8px 4px;
  }
  nav button {
    background: none;
    border: none;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    padding: 6px 4px;
    cursor: pointer;
    flex: 1;
  }
  nav button .icon { font-size: 20px; }
  nav button.active { color: var(--accent-2); }
  #loadingScreen {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
  }
  .gift-card {
    background: var(--card);
    border-radius: 16px;
    padding: 14px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .gift-card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 12px;
    background: #1f232e;
    margin-bottom: 10px;
  }
  .gift-img-fallback {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 12px;
    background: #1f232e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin-bottom: 10px;
  }
  .gift-name { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
  .gift-qty { color: var(--muted); font-size: 11px; margin-bottom: 10px; }
  .gift-price { color: var(--coin); font-weight: 700; font-size: 13px; margin-bottom: 10px; }
  .btn {
    width: 100%;
    padding: 9px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #5847c9);
    color: white;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.secondary {
    background: #2a2f3d;
  }
  .empty-msg { color: var(--muted); text-align: center; padding: 40px 0; }
  .toast {
    position: fixed;
    top: calc(18px + env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%);
    background: rgba(35,38,47,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 999px;
    font-size: 13px;
    max-width: calc(100% - 32px);
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    z-index: 200;
    animation: toastIn 0.25s ease-out;
  }
  @keyframes toastIn {
    from { transform: translate(-50%, -12px); opacity: 0; }
    to { transform: translate(-50%, 0); opacity: 1; }
  }
  .admin-link {
    display: block;
    width: 100%;
    text-align: center;
    padding: 12px;
    margin-top: 20px;
    border-radius: 12px;
    background: #2a2f3d;
    color: var(--accent-2);
    text-decoration: none;
    font-weight: 600;
  }

  /* ---- Modal ---- */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(2px);
    display: none;
    align-items: flex-end;
    justify-content: center;
    padding: 14px;
    z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal-wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
    margin-bottom: calc(14px + env(safe-area-inset-bottom));
  }
  .modal-box {
    background: rgba(23,26,33,0.85);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    width: 100%;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    padding: 22px 20px;
    max-height: 82vh;
    overflow-y: auto;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    animation: slideUp 0.25s ease-out;
  }
  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .modal-sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .modal-close {
    position: absolute; top: -14px; right: -6px;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    background: #f1f2f6; border: none; border-radius: 50%;
    color: #171a21; font-size: 16px; font-weight: 700; cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.35);
  }
  .case-item-row {
    display: flex; align-items: center; gap: 12px;
    background: #1f232e; padding: 10px; border-radius: 12px; margin-bottom: 8px;
  }
  .case-item-row .ci-icon {
    width: 40px; height: 40px; border-radius: 10px; object-fit: cover;
    background: #2a2f3d; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink:0;
  }
  .case-item-row .ci-name { flex: 1; font-size: 13px; font-weight: 600; }
  .case-item-row .ci-chance { font-weight: 700; color: var(--accent-2); font-size: 13px; }

  /* ---- Reel (case ochish animatsiyasi) ---- */
  .reel-viewport {
    position: relative;
    width: 100%;
    height: 100px;
    overflow: hidden;
    background: #1f232e;
    border-radius: 14px;
    margin: 16px 0;
  }
  .reel-marker {
    position: absolute; top: 0; bottom: 0; left: 50%;
    width: 2px; background: var(--accent-2); z-index: 5;
    box-shadow: 0 0 8px var(--accent-2);
  }
  .reel-track {
    display: flex; align-items: center; height: 100%;
    position: absolute; left: 50%; top: 0;
  }
  .reel-cell {
    width: 90px; height: 84px; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    margin: 0 5px;
    background: #2a2f3d; border-radius: 12px;
    font-size: 26px;
  }
  .reel-cell img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
  .reel-cell .rc-label { font-size: 10px; color: var(--muted); margin-top: 4px; max-width: 80px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .win-reveal {
    text-align: center; padding: 10px 0;
    animation: popIn 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  .win-reveal img { width: 90px; height: 90px; border-radius: 16px; object-fit: cover; margin-bottom: 10px; box-shadow: 0 0 30px rgba(108,92,231,0.6); }
  .win-reveal .win-icon { font-size: 60px; margin-bottom: 10px; }
  .win-reveal .win-title { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  @keyframes popIn {
    0% { transform: scale(0.3); opacity: 0; }
    60% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); }
  }
  .buy-pop {
    text-align: center; padding: 10px 0;
    animation: popIn 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  .buy-pop img, .buy-pop .bp-icon-fallback {
    width: 100px; height: 100px; border-radius: 18px; object-fit: cover; margin: 0 auto 14px;
    box-shadow: 0 0 30px rgba(108,92,231,0.5);
  }
  .bp-icon-fallback { display: flex; align-items: center; justify-content: center; font-size: 44px; background: #2a2f3d; }
  .receipt {
    background: #1f232e; border-radius: 12px; padding: 14px; margin-top: 10px;
    border: 1px dashed rgba(255,255,255,0.15);
  }
  .receipt-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; }
  .receipt-row span:first-child { color: var(--muted); }
  .receipt-row span:last-child { font-weight: 700; }
  .btn-back {
    display: block; width: 100%; margin-top: 10px; padding: 10px; border: none; border-radius: 10px;
    background: #1f232e; color: var(--muted); font-size: 13px; cursor: pointer;
  }
  .qty-row { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 14px; }
  .qty-btn {
    width: 40px; height: 40px; border-radius: 12px; border: none;
    background: #1f232e; color: var(--text); font-size: 20px; font-weight: 700; cursor: pointer;
  }
  .qty-btn:active { background: var(--accent); }
  .qty-value { font-size: 20px; font-weight: 800; min-width: 30px; text-align: center; }

  /* ---------- Event banner va wallpaper ---------- */
  #eventWallpaper {
    position: fixed; inset: 0; z-index: -1; display: none;
    background-size: cover; background-position: center; background-repeat: no-repeat;
  }
  body.event-live { background: transparent; }
  body.event-live #eventWallpaper { display: block; }
  .event-banner {
    position: relative; border-radius: 18px; overflow: hidden; margin-bottom: 20px;
    background: linear-gradient(135deg, var(--accent), #5847c9);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .event-banner img { display: block; width: 100%; aspect-ratio: 3 / 1; object-fit: cover; }
  .event-banner .eb-noimg { aspect-ratio: 3 / 1; display: flex; align-items: center; justify-content: center; font-size: 34px; }
  .event-banner .eb-info {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 14px 10px;
    background: linear-gradient(transparent, rgba(0,0,0,0.78));
    display: flex; align-items: flex-end; justify-content: space-between; gap: 10px;
  }
  .event-banner .eb-name { font-weight: 800; font-size: 15px; }
  .event-banner .eb-label { font-size: 11px; color: rgba(255,255,255,0.75); text-align: right; }
  .event-banner .eb-time { font-weight: 800; font-size: 14px; color: var(--coin); text-align: right; white-space: nowrap; }
  .event-live-badge {
    position: absolute; top: 10px; left: 10px; background: #ff4d6d; color: #fff;
    font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px;
  }
  .guar-btn-row { display: flex; gap: 10px; margin-top: 14px; }
  .guar-btn-row .btn { flex: 1; }

  /* --- Liquid Glass navigation redesign --- */
  :root {
    --glass-bg: rgba(255,255,255,0.075);
    --glass-border: rgba(255,255,255,0.13);
    --glass-highlight: rgba(255,255,255,0.16);
    --glass-shadow: 0 18px 45px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  body::before {
    content: "";
    position: fixed;
    inset: -25%;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(circle at 18% 18%, rgba(108,92,231,.16), transparent 28%),
      radial-gradient(circle at 82% 72%, rgba(162,155,254,.10), transparent 30%),
      radial-gradient(circle at 50% 100%, rgba(77,120,255,.08), transparent 28%);
    filter: blur(30px);
    animation: ambientFloat 12s ease-in-out infinite alternate;
  }
  @keyframes ambientFloat {
    from { transform: translate3d(-1%, -1%, 0) scale(1); }
    to { transform: translate3d(1%, 1%, 0) scale(1.04); }
  }
  nav#bottomNav {
    position: fixed;
    bottom: calc(14px + env(safe-area-inset-bottom));
    left: 50%;
    right: auto;
    width: min(430px, calc(100vw - 28px));
    transform: translateX(-50%);
    height: 70px;
    padding: 7px;
    gap: 4px;
    justify-content: stretch;
    align-items: stretch;
    overflow: hidden;
    background: linear-gradient(135deg, rgba(36,39,50,.72), rgba(18,20,27,.62));
    border: 1px solid var(--glass-border);
    border-radius: 25px;
    box-shadow: var(--glass-shadow);
    isolation: isolate;
  }
  nav#bottomNav::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(120deg, rgba(255,255,255,.10), transparent 35%, rgba(255,255,255,.035));
    z-index: -1;
  }
  nav#bottomNav .nav-liquid-indicator {
    position: absolute;
    top: 7px;
    left: 7px;
    width: calc((100% - 14px - 8px) / 3);
    height: calc(100% - 14px);
    border-radius: 19px;
    background:
      radial-gradient(circle at 28% 18%, rgba(255,255,255,.25), transparent 32%),
      linear-gradient(135deg, rgba(255,255,255,.22), rgba(255,255,255,.065));
    border: 1px solid rgba(255,255,255,.17);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.18),
      inset 0 -1px 2px rgba(0,0,0,.10),
      0 5px 20px rgba(0,0,0,.16);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    transform: translateX(0) scaleX(1);
    transform-origin: center;
    transition:
      left 560ms cubic-bezier(.16,1,.3,1),
      width 560ms cubic-bezier(.16,1,.3,1),
      transform 560ms cubic-bezier(.16,1,.3,1),
      border-radius 560ms cubic-bezier(.16,1,.3,1);
    will-change: transform, left, width;
    z-index: 0;
  }
  nav#bottomNav .nav-liquid-indicator::before {
    content: "";
    position: absolute;
    inset: 1px;
    border-radius: inherit;
    background: linear-gradient(90deg, rgba(255,255,255,.08), transparent 45%, rgba(255,255,255,.08));
    filter: blur(5px);
  }
  nav#bottomNav .nav-liquid-indicator::after {
    content: "";
    position: absolute;
    width: 42%;
    height: 120%;
    left: -18%;
    top: -10%;
    border-radius: 999px;
    background: rgba(255,255,255,.10);
    filter: blur(10px);
    transform: rotate(14deg);
    animation: liquidSheen 3.8s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes liquidSheen {
    0%, 28% { left: -24%; opacity: .15; }
    55%, 75% { left: 72%; opacity: .07; }
    100% { left: 112%; opacity: 0; }
  }
  nav#bottomNav button {
    position: relative;
    z-index: 1;
    height: 100%;
    min-width: 0;
    padding: 6px 5px;
    border-radius: 19px;
    color: rgba(255,255,255,.58);
    transition: color 260ms ease, transform 180ms ease;
  }
  nav#bottomNav button:hover { color: rgba(255,255,255,.9); }
  nav#bottomNav button:active { transform: scale(.94); }
  nav#bottomNav button.active { color: #fff; }
  nav#bottomNav button .icon { font-size: 20px; line-height: 1; }
  nav#bottomNav button span:last-child { font-size: 11px; font-weight: 650; letter-spacing: .1px; }
  nav#bottomNav button#moreNavButton .icon { font-size: 16px; letter-spacing: 2px; transform: translateY(-2px); }

  .more-backdrop {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: rgba(0,0,0,.36);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 300ms ease;
  }
  .more-backdrop.open { opacity: 1; pointer-events: auto; }
  .more-sheet {
    position: fixed;
    z-index: 50;
    left: 50%;
    bottom: calc(94px + env(safe-area-inset-bottom));
    width: min(430px, calc(100vw - 28px));
    transform: translate(-50%, 22px) scale(.97);
    transform-origin: bottom center;
    opacity: 0;
    pointer-events: none;
    padding: 10px 14px 14px;
    border: 1px solid var(--glass-border);
    border-radius: 27px;
    background: linear-gradient(145deg, rgba(38,41,52,.86), rgba(17,19,26,.82));
    box-shadow: 0 22px 70px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.10);
    backdrop-filter: blur(30px) saturate(155%);
    -webkit-backdrop-filter: blur(30px) saturate(155%);
    transition: transform 360ms cubic-bezier(.22,1,.36,1), opacity 240ms ease;
  }
  .more-sheet.open { transform: translate(-50%, 0) scale(1); opacity: 1; pointer-events: auto; }
  .sheet-handle { width: 38px; height: 4px; border-radius: 99px; background: rgba(255,255,255,.25); margin: 1px auto 12px; }
  .sheet-header { display: flex; align-items: center; justify-content: space-between; padding: 2px 2px 13px; }
  .sheet-title { font-size: 18px; font-weight: 800; }
  .sheet-subtitle { margin-top: 3px; color: var(--muted); font-size: 12px; }
  .sheet-close { width: 32px; height: 32px; border: 1px solid rgba(255,255,255,.08); border-radius: 50%; background: rgba(255,255,255,.07); color: #fff; cursor: pointer; }
  .more-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .more-item {
    display: flex; align-items: center; gap: 10px; text-align: left; min-height: 66px; padding: 11px;
    border: 1px solid rgba(255,255,255,.08); border-radius: 17px; color: #fff; cursor: pointer;
    background: rgba(255,255,255,.055); box-shadow: inset 0 1px 0 rgba(255,255,255,.045);
    transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
  }
  .more-item:hover { transform: translateY(-2px); background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.14); }
  .more-item:active { transform: scale(.97); }
  .more-icon { width: 38px; height: 38px; display: grid; place-items: center; flex: 0 0 38px; border-radius: 13px; background: rgba(255,255,255,.09); font-size: 20px; }
  .more-item b { display: block; font-size: 13px; }
  .more-item small { display: block; color: var(--muted); font-size: 10px; line-height: 1.25; margin-top: 3px; }
  @media (max-width: 360px) {
    .more-grid { grid-template-columns: 1fr; }
    .more-item { min-height: 58px; }
  }

</style>
</head>
<body>
  <div id="loadingScreen">Yuklanmoqda...</div>

  <div id="app">
    <header>
      <div class="brand"><img src="logo.jpg" alt="MTshop" class="logo-icon"> <span>MTshop</span></div>
      <div class="coin-badge">🪙 <span id="coinBalance">0</span></div>
    </header>

    <main id="main">
      <!-- tab content shu yerga chiqadi -->
    </main>

    <nav id="bottomNav" aria-label="Asosiy menyu">
      <div class="nav-liquid-indicator" aria-hidden="true"></div>
      <button data-tab="shops" class="active" aria-label="Shops"><span class="icon">🛍️</span><span>Shops</span></button>
      <button data-tab="inventor" aria-label="Inventor"><span class="icon">🎒</span><span>Inventor</span></button>
      <button id="moreNavButton" type="button" aria-haspopup="dialog" aria-expanded="false"><span class="icon">•••</span><span>Yana</span></button>
    </nav>

    <div class="more-backdrop" id="moreBackdrop"></div>
    <section class="more-sheet" id="moreSheet" role="dialog" aria-modal="true" aria-labelledby="moreSheetTitle" aria-hidden="true">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div>
          <div class="sheet-title" id="moreSheetTitle">Yana</div>
          <div class="sheet-subtitle">Qo‘shimcha bo‘limlar</div>
        </div>
        <button class="sheet-close" id="closeMoreButton" type="button" aria-label="Yopish">✕</button>
      </div>
      <div class="more-grid">
        <button class="more-item" data-tab="jonatmoq"><span class="more-icon">📤</span><span><b>Jo‘natmoq</b><small>Gift yoki case yuborish</small></span></button>
        <button class="more-item" data-tab="mypet"><span class="more-icon">🐾</span><span><b>MyPet</b><small>Petingizni boshqaring</small></span></button>
        <button class="more-item" data-tab="kreditlar"><span class="more-icon">💳</span><span><b>Kreditlar</b><small>Kredit va kafil so‘rovlari</small></span></button>
        <button class="more-item" data-tab="profils"><span class="more-icon">👤</span><span><b>Profils</b><small>Profil va hisob</small></span></button>
      </div>
    </section>
  </div>

  <div id="eventWallpaper"></div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-wrap">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-box">
        <div id="modalBody"></div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    let currentUser = null;
    let actionInProgress = false; // tugmani ketma-ket tez-tez bosishning oldini olish uchun

    async function init() {
      try {
        const res = await fetch(`${API_BASE}/api/auth/me`, { credentials: 'include' });
        if (!res.ok) {
          window.location.href = 'login.html';
          return;
        }
        currentUser = await res.json();
        updateCoinBadge();
        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        const validTabs = ['shops', 'inventor', 'jonatmoq', 'mypet', 'kreditlar', 'profils'];
        const startTab = validTabs.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'shops';
        renderTab(startTab);
        refreshEvent();
        setInterval(refreshEvent, 30000);
        checkGuarantorRequests().then(shown => { if (!shown) checkIncomingTransfers(); });
        setInterval(pollGuarantorRequests, 30000);
      } catch (e) {
        window.location.href = 'login.html';
      }
    }

    function updateCoinBadge() {
      document.getElementById('coinBalance').textContent = currentUser.coin_balance;
    }

    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2200);
    }

    function giftImg(g) {
      return g.image_url
        ? `<img src="${g.image_url}" alt="${g.name}">`
        : `<div class="gift-img-fallback">🎁</div>`;
    }

    async function renderTab(tab) {
      if (eventTicker) { clearInterval(eventTicker); eventTicker = null; }
      document.querySelectorAll('nav button').forEach(b => {
        b.classList.toggle('active', b.dataset.tab === tab);
      });
      const main = document.getElementById('main');

      if (tab === 'shops') {
        main.innerHTML = `
          <div id="eventBanner"></div>
          <div class="page-title">Shops</div>
          <div class="page-sub">Giftlar va case'larni sotib oling.</div>
          <div class="section-title">🎁 Giftlar</div>
          <div id="shopGrid" class="grid"></div>
          <div class="section-title" style="margin-top:24px">📦 Case'lar</div>
          <div id="shopCaseGrid" class="grid"></div>
        `;
        renderEventBanner();
        loadShop();
        loadShopCases();
      } else if (tab === 'inventor') {
        main.innerHTML = `
          <div class="page-title">Inventor</div>
          <div class="page-sub">Sizning giftlaringiz va case'laringiz.</div>
          <div class="section-title">🎁 Giftlarim</div>
          <div id="invGrid" class="grid"></div>
          <div class="section-title" style="margin-top:24px">📦 Case'larim</div>
          <div id="invCaseGrid" class="grid"></div>
        `;
        loadInventory();
        loadInventoryCases();
      } else if (tab === 'jonatmoq') {
        renderJonatmoq(main);
      } else if (tab === 'kreditlar') {
        renderKreditlar(main);
      } else if (tab === 'mypet') {
        renderMyPet(main);
      } else if (tab === 'profils') {
        renderProfil(main);
      }
    }

    const UZ_MONTHS = ['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
    function formatUzDate(isoStr) {
      const d = new Date(isoStr);
      return `${d.getDate()}-${UZ_MONTHS[d.getMonth()]} ${d.getFullYear()}-yil`;
    }

    let myCreditsCache = [];
    let creditTypesCache = [];

    async function renderKreditlar(main) {
      main.innerHTML = `
        <div class="page-title">Kreditlar</div>
        <div class="page-sub">Kredit oling yoki mavjud to'lovlaringizni ko'ring.</div>
        <div id="guarIncomingWrap"></div>
        <div class="section-title">💳 Mening kreditlarim</div>
        <div id="myCreditsList"></div>
        <div id="myRequestsWrap"></div>
        <div class="section-title" style="margin-top:24px">🏦 Mavjud kredit turlari</div>
        <div id="creditTypesList"></div>
      `;
      refreshMe();
      loadGuarantorIncomingList();
      loadMyRequests();
      loadMyCredits();
      loadCreditTypesForUser();
    }

    async function loadMyCredits() {
      const el = document.getElementById('myCreditsList');
      el.innerHTML = '<div class="empty-msg">Yuklanmoqda...</div>';
      const res = await fetch(`${API_BASE}/api/credits/my`, { credentials: 'include' });
      const list = await res.json();
      myCreditsCache = list;
      const active = list.filter(c => c.status !== 'paid');
      if (!active.length) {
        el.innerHTML = '<div class="empty-msg">Faol kreditingiz yo\'q</div>';
        return;
      }
      el.innerHTML = active.map(c => `
        <div class="gift-card" style="text-align:left; padding:16px; margin-bottom:10px;">
          <div style="font-weight:700; margin-bottom:6px;">${c.type_name}</div>
          <div style="font-size:13px; color:var(--muted); margin-bottom:10px;">Qolgan qarz: 🪙 ${c.remaining_amount}</div>
          <button class="btn" onclick="openCreditDetail(${c.id})">Ko'rish</button>
        </div>
      `).join('');
    }

    function openCreditDetail(creditId) {
      const c = myCreditsCache.find(x => x.id === creditId);
      if (!c) return;
      const statusBadge = c.status === 'defaulted' ? `<div style="color:#ff6b6b;font-weight:700;margin-bottom:10px;">⛔ BLOKLANGAN</div>` : '';
      const paymentsHtml = c.payments.length
        ? c.payments.map(p => `
            <div class="case-item-row">
              <div class="ci-icon">${p.payment_type === 'early' ? '⚡' : '📅'}</div>
              <div class="ci-name">🪙 ${p.amount} ${p.payment_type === 'early' ? '(oldindan)' : '(jadval)'}</div>
              <div class="ci-chance" style="font-size:11px;">${formatUzDate(p.created_at)}</div>
            </div>`).join('')
        : `<div class="modal-sub">Hali to'lov qilinmagan</div>`;

      document.getElementById('modalBody').innerHTML = `
        <div class="modal-title">${c.type_name}</div>
        ${statusBadge}
        <div class="case-item-row"><div class="ci-name">Siz olgan summa</div><div class="ci-chance">🪙 ${c.principal_amount}</div></div>
        <div class="case-item-row"><div class="ci-name">Siz qaytaradigan summa</div><div class="ci-chance">🪙 ${c.total_to_pay}</div></div>
        <div class="case-item-row"><div class="ci-name">Kredit foizi</div><div class="ci-chance">${c.interest_percent}%</div></div>
        <div class="case-item-row"><div class="ci-name">Qolgan qarz</div><div class="ci-chance">🪙 ${c.remaining_amount}</div></div>
        <div class="case-item-row"><div class="ci-name">Keyingi to'lov</div><div class="ci-chance" style="font-size:12px;">${formatUzDate(c.next_payment_at)}</div></div>

        <div class="modal-sub" style="margin-top:16px">Oxirgi to'lovlarim</div>
        ${paymentsHtml}

        ${c.status === 'active' ? `<button class="btn" style="margin-top:14px" onclick="openPayChoice(${c.id})">To'lash</button>` : ''}
      `;
      openModal();
    }

    function openPayChoice(creditId) {
      const c = myCreditsCache.find(x => x.id === creditId);
      document.getElementById('modalBody').innerHTML = `
        <div class="modal-title">To'lov usulini tanlang</div>
        <div class="modal-sub">"${c.type_name}" uchun</div>
        <div class="gift-card" style="text-align:left; padding:14px; margin-bottom:10px;">
          <div style="font-weight:700; margin-bottom:4px;">📅 Jadval bo'yicha</div>
          <div style="font-size:13px; color:var(--muted); margin-bottom:10px;">Haftalik belgilangan to'lov: 🪙 ${Math.min(c.weekly_payment, c.remaining_amount)}</div>
          <button class="btn" onclick="payScheduled(${c.id})">Shu summani to'lash</button>
        </div>
        <div class="gift-card" style="text-align:left; padding:14px;">
          <div style="font-weight:700; margin-bottom:4px;">⚡ Oldindan to'lov</div>
          <div style="font-size:13px; color:var(--muted); margin-bottom:10px;">O'zingiz xohlagan summani to'lang (qolgan qarz: 🪙 ${c.remaining_amount})</div>
          <input type="number" class="send-input" id="earlyPayAmount" placeholder="Miqdor" min="0" max="${c.remaining_amount}" step="0.01" style="margin-bottom:10px;">
          <button class="btn" onclick="payEarly(${c.id})">To'lash</button>
        </div>
        <button class="btn-back" onclick="openCreditDetail(${c.id})">&larr; Orqaga</button>
      `;
    }

    async function payScheduled(creditId) {
      await doPay(creditId, { mode: 'scheduled' });
    }

    async function payEarly(creditId) {
      const amount = parseFloat(document.getElementById('earlyPayAmount').value);
      if (!amount || amount <= 0) { showToast("Miqdorni to'g'ri kiriting"); return; }
      await doPay(creditId, { mode: 'early', amount });
    }

    async function doPay(creditId, body) {
      const res = await fetch(`${API_BASE}/api/credits/${creditId}/pay`, {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) { showToast(data.error || 'Xatolik'); return; }
      currentUser.coin_balance = data.coin_balance;
      updateCoinBadge();
      showReceipt(data);
      loadMyCredits();
    }

    function showReceipt(data) {
      const now = new Date();
      document.getElementById('modalBody').innerHTML = `
        <div class="win-reveal">
          <div class="win-icon">✅</div>
          <div class="win-title">To'lov tasdiqlandi</div>
          <div class="receipt">
            <div class="receipt-row"><span>To'langan summa</span><span>🪙 ${data.paid_amount}</span></div>
            <div class="receipt-row"><span>Qolgan qarz</span><span>🪙 ${data.remaining_amount}</span></div>
            <div class="receipt-row"><span>Holat</span><span>${data.status === 'paid' ? "To'liq yopildi 🎉" : 'Faol'}</span></div>
            <div class="receipt-row"><span>Sana</span><span>${formatUzDate(now.toISOString())}</span></div>
          </div>
          <button class="btn" style="margin-top:14px" onclick="closeModal(); loadMyCredits();">Yopish</button>
        </div>
      `;
    }

    async function loadCreditTypesForUser() {
      const el = document.getElementById('creditTypesList');
      el.innerHTML = '<div class="empty-msg">Yuklanmoqda...</div>';
      const res = await fetch(`${API_BASE}/api/credits/types`, { credentials: 'include' });
      const types = await res.json();
      creditTypesCache = types;
      if (!types.length) {
        el.innerHTML = '<div class="empty-msg">Hozircha kredit turlari yo\'q</div>';
        return;
      }
      el.innerHTML = types.map(t => `
        <div class="gift-card" style="text-align:left; padding:16px; margin-bottom:10px;">
          <div style="font-weight:700; margin-bottom:6px;">${t.name}</div>
          <div style="font-size:13px; color:var(--muted); margin-bottom:10px;">
            ${t.min_amount}–${t.max_amount} coin &middot; ${t.interest_percent}% foiz
          </div>
          <button class="btn" onclick="openCreditTypeModal(${t.id})">Ko'rish</button>
        </div>
      `).join('');
    }

    function openCreditTypeModal(typeId) {
      const t = creditTypesCache.find(x => x.id === typeId);
      if (!t) return;
      document.getElementById('modalBody').innerHTML = `
        <div class="modal-title">${t.name}</div>
        <div class="case-item-row"><div class="ci-name">Minimal summa</div><div class="ci-chance">🪙 ${t.min_amount}</div></div>
        <div class="case-item-row"><div class="ci-name">Maksimal summa</div><div class="ci-chance">🪙 ${t.max_amount}</div></div>
        <div class="case-item-row"><div class="ci-name">Foizi</div><div class="ci-chance">${t.interest_percent}%</div></div>
        <div class="case-item-row"><div class="ci-name">To'lash muddati</div><div class="ci-chance">${t.installments_weeks} hafta</div></div>

        <label class="send-label">Qancha coin olmoqchisiz?</label>
        <input type="number" class="send-input" id="takeCreditAmt" min="${t.min_amount}" max="${t.max_amount}" step="0.01" placeholder="${t.min_amount} - ${t.max_amount}">
        <label class="send-label">Kafil username</label>
        <input type="text" class="send-input" id="takeCreditGuarantor" placeholder="Kafil bo'ladigan foydalanuvchi username" autocapitalize="none" autocomplete="off">
        <div class="send-hint">Kredit darhol berilmaydi: kafil saytga kirib tasdiqlagandan keyingina coin hisobingizga tushadi.</div>
        <div class="msg" id="takeCreditMsg"></div>
        <button class="btn" style="margin-top:14px" onclick="submitTakeCredit(${t.id})">Kafilga yuborish</button>
      `;
      openModal();
    }

    async function submitTakeCredit(typeId) {
      if (actionInProgress) return;
      const msg = document.getElementById('takeCreditMsg');
      msg.textContent = ''; msg.className = 'msg';
      const amount = parseFloat(document.getElementById('takeCreditAmt').value);
      const guarantor = document.getElementById('takeCreditGuarantor').value.trim();
      if (!amount) { msg.textContent = "Miqdorni kiriting"; msg.classList.add('error'); return; }
      if (!guarantor) { msg.textContent = "Kafil username kiriting"; msg.classList.add('error'); return; }

      actionInProgress = true;
      try {
        const res = await fetch(`${API_BASE}/api/credits/take`, {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credit_type_id: typeId, amount, guarantor_username: guarantor }),
        });
        const data = await res.json();
        if (!res.ok) { msg.textContent = data.error || 'Xatolik'; msg.classList.add('error'); return; }

        closeModal();
        showToast(`So'rov @${data.guarantor_username} ga yuborildi. Kafil tasdiqlasa kredit beriladi 🤝`);
        loadMyRequests();
        loadCreditTypesForUser();
      } finally {
        actionInProgress = false;
      }
    }

    // ---------- Kafil (kafolat) tizimi ----------

    function esc(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function refreshMe() {
      try {
        const res = await fetch(`${API_BASE}/api/auth/me`, { credentials: 'include' });
        if (res.ok) { currentUser = await res.json(); updateCoinBadge(); }
      } catch (e) {}
    }

    const guarantorShown = new Set();

    async function fetchIncomingGuarantor() {
      try {
        const res = await fetch(`${API_BASE}/api/credits/requests/incoming`, { credentials: 'include' });
        if (!res.ok) return [];
        return await res.json();
      } catch (e) { return []; }
    }

    // Sayt ochilganda: kafillik so'rovlari bo'lsa darhol oyna chiqadi. true qaytaradi, agar oyna ko'rsatilgan bo'lsa.
    async function checkGuarantorRequests() {
      const list = await fetchIncomingGuarantor();
      if (!list.length) return false;
      list.forEach(r => guarantorShown.add(r.id));
      showGuarantorModal(list, 0);
      return true;
    }

    // Sayt ochiq turganda yangi so'rov kelsa ham oyna chiqadi (har so'rov faqat bir marta avtomatik chiqadi)
    async function pollGuarantorRequests() {
      if (document.getElementById('modalOverlay').classList.contains('open')) return;
      const list = await fetchIncomingGuarantor();
      const fresh = list.filter(r => !guarantorShown.has(r.id));
      if (!fresh.length) return;
      fresh.forEach(r => guarantorShown.add(r.id));
      showGuarantorModal(fresh, 0);
    }

    function showGuarantorModal(list, index) {
      const r = list[index];
      window.__guarList = list;
      document.getElementById('modalBody').innerHTML = `
        <div class="win-reveal">
          <div class="win-icon">🤝</div>
          <div class="win-title">Kafillik so'rovi</div>
          <div class="modal-sub">@${esc(r.requester_username)} sizni kredit uchun kafil qilmoqchi.</div>
          <div class="receipt">
            <div class="receipt-row"><span>Kredit olayotgan</span><span>@${esc(r.requester_username)}</span></div>
            <div class="receipt-row"><span>Kredit nomi</span><span>${esc(r.credit_name)}</span></div>
            <div class="receipt-row"><span>Miqdori</span><span>🪙 ${r.amount}</span></div>
            <div class="receipt-row"><span>To'lash muddati</span><span>${r.installments_weeks} hafta</span></div>
          </div>
          <div class="guar-btn-row">
            <button class="btn secondary" onclick="respondGuarantor(${r.id}, false, ${index})">Rad etish</button>
            <button class="btn" onclick="respondGuarantor(${r.id}, true, ${index})">Tasdiqlash</button>
          </div>
          ${list.length > 1 ? `<div class="send-hint" style="text-align:center">${index + 1} / ${list.length}</div>` : ''}
        </div>
      `;
      openModal();
    }

    async function respondGuarantor(id, approve, index) {
      if (actionInProgress) return;
      actionInProgress = true;
      try {
        const res = await fetch(`${API_BASE}/api/credits/requests/${id}/respond`, {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ approve }),
        });
        const data = await res.json();
        if (!res.ok) showToast(data.error || 'Xatolik');
        else showToast(approve ? 'Tasdiqladingiz ✅' : 'Rad etdingiz');
      } finally {
        actionInProgress = false;
      }
      const list = window.__guarList || [];
      if (index < list.length - 1) {
        showGuarantorModal(list, index + 1);
      } else {
        closeModal();
        if (document.getElementById('guarIncomingWrap')) loadGuarantorIncomingList();
        checkIncomingTransfers();
      }
    }

    // Kreditlar sahifasida: menga kelgan (javob kutayotgan) kafillik so'rovlari
    async function loadGuarantorIncomingList() {
      const wrap = document.getElementById('guarIncomingWrap');
      if (!wrap) return;
      const list = await fetchIncomingGuarantor();
      window.__guarPageList = list;
      if (!list.length) { wrap.innerHTML = ''; return; }
      wrap.innerHTML = `
        <div class="section-title">🤝 Kafillik so'rovlari</div>
        ${list.map((r, i) => `
          <div class="gift-card" style="text-align:left; padding:16px; margin-bottom:10px;">
            <div style="font-weight:700; margin-bottom:6px;">@${esc(r.requester_username)} &middot; ${esc(r.credit_name)}</div>
            <div style="font-size:13px; color:var(--muted); margin-bottom:10px;">🪙 ${r.amount} &middot; ${r.installments_weeks} hafta</div>
            <button class="btn" onclick="showGuarantorModal(window.__guarPageList, ${i})">Ko'rish</button>
          </div>
        `).join('')}
        <div style="height:24px"></div>
      `;
    }

    // Kreditlar sahifasida: men yuborgan so'rovlar (kutilayotgan va rad etilganlar)
    async function loadMyRequests() {
      const wrap = document.getElementById('myRequestsWrap');
      if (!wrap) return;
      const res = await fetch(`${API_BASE}/api/credits/requests/mine`, { credentials: 'include' });
      if (!res.ok) return;
      const list = (await res.json()).filter(r => r.status === 'pending' || r.status === 'rejected');
      if (!list.length) { wrap.innerHTML = ''; return; }
      wrap.innerHTML = `
        <div class="section-title" style="margin-top:24px">📨 Kafil so'rovlarim</div>
        ${list.map(r => `
          <div class="gift-card" style="text-align:left; padding:16px; margin-bottom:10px;">
            <div style="font-weight:700; margin-bottom:6px;">${esc(r.credit_name)} &middot; 🪙 ${r.amount}</div>
            <div style="font-size:13px; color:var(--muted); margin-bottom:${r.status === 'pending' ? '10px' : '0'};">
              Kafil: @${esc(r.guarantor_username)} &middot;
              ${r.status === 'pending' ? '⏳ Javob kutilmoqda' : '❌ Rad etildi'}
            </div>
            ${r.status === 'pending' ? `<button class="btn secondary" onclick="cancelMyRequest(${r.id})">Bekor qilish</button>` : ''}
          </div>
        `).join('')}
      `;
    }

    async function cancelMyRequest(id) {
      if (actionInProgress) return;
      actionInProgress = true;
      try {
        const res = await fetch(`${API_BASE}/api/credits/requests/${id}/cancel`, { method: 'POST', credentials: 'include' });
        const data = await res.json();
        if (!res.ok) showToast(data.error || 'Xatolik');
        else showToast("So'rov bekor qilindi");
      } finally {
        actionInProgress = false;
      }
      loadMyRequests();
    }

    // ---------- Event: banner, hisoblagich va sayt foni ----------

    let eventState = { event: null, offset: 0, loaded: false };
    let eventTicker = null;
    let lastEventRefresh = 0;

    function fmtCountdown(ms) {
      const s = Math.max(0, Math.floor(ms / 1000));
      const days = Math.floor(s / 86400);
      if (days >= 1) return `${days} Day`;
      const hours = Math.floor(s / 3600);
      if (hours >= 1) return `${hours} hour`;
      return `${Math.floor(s / 60)} minute and ${s % 60} second`;
    }

    function eventNow() { return Date.now() + eventState.offset; }

    function applyEventTheme() {
      const ev = eventState.event;
      const wp = document.getElementById('eventWallpaper');
      if (ev && ev.status === 'live' && ev.wallpaper_url) {
        wp.style.backgroundImage = `linear-gradient(rgba(15,17,21,0.55), rgba(15,17,21,0.55)), url("${ev.wallpaper_url}")`;
        document.body.classList.add('event-live');
      } else {
        document.body.classList.remove('event-live');
        wp.style.backgroundImage = '';
      }
    }

    async function refreshEvent() {
      lastEventRefresh = Date.now();
      try {
        const res = await fetch(`${API_BASE}/api/events/current`, { credentials: 'include' });
        if (!res.ok) return;
        const data = await res.json();
        const prev = eventState;
        eventState = { event: data.event, offset: data.server_now - Date.now(), loaded: true };
        applyEventTheme();
        renderEventBanner();

        // Event holati o'zgarsa (boshlandi / tugadi) Shop yangilanadi — yangi gift/case'lar paydo bo'ladi
        const a = prev.event, b = data.event;
        const changed = prev.loaded && ((a && a.id) !== (b && b.id) || (a && b && a.status !== b.status));
        if (changed && document.getElementById('shopGrid')) { loadShop(); loadShopCases(); }
      } catch (e) {}
    }

    function renderEventBanner() {
      const box = document.getElementById('eventBanner');
      if (eventTicker) { clearInterval(eventTicker); eventTicker = null; }
      if (!box) return;
      const ev = eventState.event;
      if (!ev) { box.innerHTML = ''; return; }

      const live = ev.status === 'live';
      box.innerHTML = `
        <div class="event-banner">
          ${ev.banner_url ? `<img src="${ev.banner_url}" alt="">` : `<div class="eb-noimg">🎉</div>`}
          ${live ? `<div class="event-live-badge">● LIVE</div>` : ''}
          <div class="eb-info">
            <div class="eb-name">${esc(ev.name)}</div>
            <div>
              <div class="eb-label">${live ? 'Tugashiga' : 'Boshlanishiga'}</div>
              <div class="eb-time" id="ebTime"></div>
            </div>
          </div>
        </div>
      `;

      const target = new Date(live ? ev.ends_at : ev.starts_at).getTime();
      const tick = () => {
        const el = document.getElementById('ebTime');
        if (!el) { clearInterval(eventTicker); eventTicker = null; return; }
        const left = target - eventNow();
        el.textContent = fmtCountdown(left);
        if (left <= 0 && Date.now() - lastEventRefresh > 3000) refreshEvent();
      };
      tick();
      eventTicker = setInterval(tick, 1000);
    }

    // ---------- Push bildirishnomalar ----------

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
    }

    function pushSupported() {
      return 'serviceWorker' in navigator && 'PushManager' in window;
    }

    async function getExistingPushSubscription() {
      const reg = await navigator.serviceWorker.getRegistration();
      if (!reg) return null;
      return reg.pushManager.getSubscription();
    }

    async function initPushUI() {
      const textEl = document.getElementById('pushStatusText');
      const btn = document.getElementById('pushToggleBtn');
      if (!textEl || !btn) return;

      if (!pushSupported()) {
        textEl.textContent = "Bu brauzer bildirishnomalarni qo'llab-quvvatlamaydi.";
        btn.style.display = 'none';
        return;
      }
      if (Notification.permission === 'denied') {
        textEl.textContent = "Bildirishnomalar brauzer sozlamalarida bloklangan. Yoqish uchun sayt sozlamalaridan ruxsat bering.";
        btn.style.display = 'none';
        return;
      }

      const sub = await getExistingPushSubscription();
      if (sub) {
        textEl.textContent = "Bildirishnomalar shu qurilmada yoqilgan ✅";
        btn.textContent = "O'chirish";
      } else {
        textEl.textContent = "Pet kasal bo'lsa, kredit muddati yaqinlashsa, sizga sovg'a kelsa — xabar oling.";
        btn.textContent = 'Yoqish 🔔';
      }
      btn.disabled = false;
    }

    async function togglePush() {
      const btn = document.getElementById('pushToggleBtn');
      const textEl = document.getElementById('pushStatusText');
      btn.disabled = true;

      try {
        const existing = await getExistingPushSubscription();
        if (existing) {
          await fetch(`${API_BASE}/api/push/unsubscribe`, {
            method: 'POST', credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ endpoint: existing.endpoint }),
          });
          await existing.unsubscribe();
          showToast("Bildirishnomalar o'chirildi");
          await initPushUI();
          return;
        }

        const reg = await navigator.serviceWorker.register('sw.js');
        await navigator.serviceWorker.ready;

        const perm = await Notification.requestPermission();
        if (perm !== 'granted') {
          textEl.textContent = "Ruxsat berilmadi. Xohlagan vaqtingizda qayta urinib ko'rishingiz mumkin.";
          btn.disabled = false;
          return;
        }

        const keyRes = await fetch(`${API_BASE}/api/push/public-key`, { credentials: 'include' });
        const keyData = await keyRes.json();
        if (!keyRes.ok) { showToast(keyData.error || 'Xatolik'); btn.disabled = false; return; }

        const sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(keyData.publicKey),
        });

        const saveRes = await fetch(`${API_BASE}/api/push/subscribe`, {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ subscription: sub.toJSON() }),
        });
        if (!saveRes.ok) {
          await sub.unsubscribe();
          const err = await saveRes.json().catch(() => ({}));
          showToast(err.error || 'Obuna saqlanmadi');
          btn.disabled = false;
          return;
        }

        showToast('Bildirishnomalar yoqildi! 🔔');
        await initPushUI();
      } catch (e) {
        showToast('Xatolik: ' + (e.message || 'nomalum'));
        btn.disabled = false;
      }
    }

    function renderProfil(main) {
      const statusImg = currentUser.status_image_url
        ? `<img src="${currentUser.status_image_url}" style="width:28px;height:28px;border-radius:8px;object-fit:cover;vertical-align:middle;margin-left:6px;">`
        : '';
      main.innerHTML = `
        <div class="page-title">Profils</div>
        <div class="page-sub">@${currentUser.username}${statusImg}</div>
        <div class="gift-card" style="text-align:left; padding:20px;">
          <div style="margin-bottom:8px;"><b>Username:</b> ${currentUser.username}</div>
          <div style="margin-bottom:8px;"><b>Coin balans:</b> ${currentUser.coin_balance} 🪙</div>
        </div>
        ${currentUser.is_admin ? `<a href="admin.html" class="admin-link">⚙️ Admin panel</a>` : ''}
        <button class="btn secondary" style="margin-top:14px;" onclick="logout()">Hisobdan chiqish</button>

        <div class="section-title" style="margin-top:28px">🔔 Bildirishnomalar</div>
        <div class="gift-card" style="text-align:left; padding:16px;">
          <div class="modal-sub" id="pushStatusText" style="margin-bottom:12px;">Tekshirilmoqda...</div>
          <button class="btn" id="pushToggleBtn" onclick="togglePush()" disabled>...</button>
        </div>

        <div class="section-title" style="margin-top:28px">🔍 Foydalanuvchilarni qidirish</div>
        <input type="text" class="send-input" id="userSearchInput" placeholder="Username kiriting...">
        <div id="userSearchResults" style="margin-top:12px"></div>
      `;

      initPushUI();

      let searchTimeout;
      document.getElementById('userSearchInput').addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        const q = e.target.value.trim();
        if (!q) { document.getElementById('userSearchResults').innerHTML = ''; return; }
        searchTimeout = setTimeout(() => runUserSearch(q), 300);
      });
    }

    async function runUserSearch(q) {
      const el = document.getElementById('userSearchResults');
      el.innerHTML = '<div class="empty-msg">Qidirilmoqda...</div>';
      const res = await fetch(`${API_BASE}/api/users/search?q=${encodeURIComponent(q)}`, { credentials: 'include' });
      const list = await res.json();
      if (!list.length) { el.innerHTML = '<div class="empty-msg">Topilmadi</div>'; return; }
      el.innerHTML = list.map(u => {
        const img = u.status_image_url
          ? `<img src="${u.status_image_url}" class="ci-icon">`
          : `<div class="ci-icon">👤</div>`;
        return `
          <div class="case-item-row" style="cursor:pointer" onclick="openUserProfile('${u.username}')">
            ${img}
            <div class="ci-name">@${u.username}</div>
          </div>`;
      }).join('');
    }

    async function openUserProfile(username) {
      document.getElementById('modalBody').innerHTML = `<div class="modal-title">Yuklanmoqda...</div>`;
      openModal();

      const res = await fetch(`${API_BASE}/api/users/${encodeURIComponent(username)}/profile`, { credentials: 'include' });
      const data = await res.json();
      if (!res.ok) {
        document.getElementById('modalBody').innerHTML = `<div class="modal-title">Xatolik</div><div class="modal-sub">${data.error || ''}</div>`;
        return;
      }

      const statusImg = data.status_image_url
        ? `<img src="${data.status_image_url}" style="width:24px;height:24px;border-radius:6px;object-fit:cover;vertical-align:middle;margin-left:6px;">`
        : '';

      const giftsHtml = data.gifts.length
        ? data.gifts.map(g => `
            <div class="case-item-row">
              ${g.image_url ? `<img class="ci-icon" src="${g.image_url}">` : `<div class="ci-icon">🎁</div>`}
              <div class="ci-name">${g.name}</div>
              <div class="ci-chance">x${g.count}</div>
            </div>`).join('')
        : `<div class="modal-sub">Giftlari yo'q</div>`;

      const casesHtml = data.cases.length
        ? data.cases.map(c => `
            <div class="case-item-row">
              ${c.image_url ? `<img class="ci-icon" src="${c.image_url}">` : `<div class="ci-icon">📦</div>`}
              <div class="ci-name">${c.name}</div>
              <div class="ci-chance">x${c.count}</div>
            </div>`).join('')
        : `<div class="modal-sub">Case'lari yo'q</div>`;

      const petsHtml = data.pets.length
        ? `<div class="modal-sub">${data.pets.length} ta pet bor</div>`
        : `<div class="modal-sub">Pet'lari yo'q</div>`;

      document.getElementById('modalBody').innerHTML = `
        <div class="modal-title">@${data.username}${statusImg}</div>
        <div class="modal-sub" style="margin-top:14px">🎁 Giftlari</div>
        ${giftsHtml}
        <div class="modal-sub" style="margin-top:14px">📦 Case'lari</div>
        ${casesHtml}
        <div class="modal-sub" style="margin-top:14px">🐾 Pet'lari</div>
        ${petsHtml}
      `;
    }

    async function logout() {
      await fetch(`${API_BASE}/api/auth/logout`, { method: 'POST', credentials: 'include' });
      window.location.href = 'login.html';
    }

    let lastLoadedShopGifts = [];

    async function loadShop() {
      const grid = document.getElementById('shopGrid');
      grid.innerHTML = '<div class="empty-msg">Yuklanmoqda...</div>';
      const res = await fetch(`${API_BASE}/api/gifts`, { credentials: 'include' });
      const gifts = await res.json();
      lastLoadedShopGifts = gifts;
      if (!gifts.length) {
        grid.innerHTML = '<div class="empty-msg">Hozircha giftlar yo\'q</div>';
        return;
      }
      grid.innerHTML = gifts.map(g => `
        <div class="gift-card">
          ${giftImg(g)}
          <div class="gift-name">${g.name}</div>
          <div class="gift-qty">${g.quantity === null ? 'Cheksiz' : 'Qoldi: ' + g.quantity}</div>
          <div class="gift-price">🪙 ${g.price}</div>
          <button class="btn" onclick="openGiftInfoModal(${g.id})">Ko'rish</button>
        </div>
      `).join('');
    }

    function openGiftInfoModal(giftId) {
      const g = lastLoadedShopGifts.find(x => x.id === giftId);
      if (!g) return;
      const maxQty = g.quantity === null ? 999 : g.quantity;
      const media = g.image_url ? `<img src="${g.image_url}">` : `<div class="bp-icon-fallback">🎁</div>`;

      document.getElementById('modalBody').innerHTML = `
        <div class="buy-pop">
          ${media}
          <div class="win-title">${g.name}</div>
          <div class="modal-sub">🪙 ${g.price} &middot; ${g.quantity === null ? 'Cheksiz' : 'Qoldi: ' + g.quantity}</div>
        </div>
        <div class="qty-row">
          <button class="qty-btn" onclick="changeGiftQty(-1, ${maxQty})">−</button>
          <div class="qty-value" id="giftQtyValue">1</div>
          <button class="qty-btn" onclick="changeGiftQty(1, ${maxQty})">+</button>
        </div>
        <div class="modal-sub" style="text-align:center; margin-top:6px;" id="giftQtyTotal">Jami: 🪙 ${g.price}</div>
        <button class="btn" style="margin-top:14px" onclick="confirmBuyGift(${g.id})">Sotib olish</button>
      `;
      window.__giftUnitPrice = g.price;
      openModal();
    }

    function changeGiftQty(delta, maxQty) {
      const el = document.getElementById('giftQtyValue');
      let val = parseInt(el.textContent, 10) + delta;
      if (val < 1) val = 1;
      if (val > maxQty) val = maxQty;
      el.textContent = val;
      document.getElementById('giftQtyTotal').textContent = `Jami: 🪙 ${Math.round(val * window.__giftUnitPrice * 100) / 100}`;
    }

    async function confirmBuyGift(giftId) {
      const quantity = parseInt(document.getElementById('giftQtyValue').textContent, 10);
      await buyGift(giftId, quantity);
    }

    async function buyGift(giftId, quantity) {
      if (actionInProgress) return;
      actionInProgress = true;
      try {
        const res = await fetch(`${API_BASE}/api/gifts/${giftId}/buy`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ quantity: quantity || 1 }),
        });
        const data = await res.json();
        if (!res.ok) {
          showToast(data.error || 'Xatolik');
          return;
        }
        currentUser.coin_balance = data.coin_balance;
        updateCoinBadge();
        loadShop();

        const gift = lastLoadedShopGifts.find(g => g.id === giftId);
        const media = gift && gift.image_url
          ? `<img src="${gift.image_url}">`
          : `<div class="bp-icon-fallback">🎁</div>`;
        document.getElementById('modalBody').innerHTML = `
          <div class="buy-pop">
            ${media}
            <div class="win-title">✅ Sotib olindi!</div>
            <div class="modal-sub">${gift ? gift.name : ''} x${data.bought_qty || quantity} inventorga tushdi</div>
            <button class="btn" onclick="closeModal()">Yopish</button>
          </div>
        `;
        openModal();
      } finally {
        actionInProgress = false;
      }
    }

    async function loadInventory() {
      const grid = document.getElementById('invGrid');
      grid.innerHTML = '<div class="empty-msg">Yuklanmoqda...</div>';
      const res = await fetch(`${API_BASE}/api/inventory/gifts`, { credentials: 'include' });
      const items = await res.json();
      if (!items.length) {
        grid.innerHTML = '<div class="empty-msg">Inventoringiz hozircha bo\'sh</div>';
        return;
      }
      grid.innerHTML = items.map(it => `
        <div class="gift-card">
          ${giftImg({ image_url: it.image_url, name: it.name })}
          <div class="gift-name">${it.name}</div>
          <div class="gift-price">🪙 ${Math.round(it.current_price * 0.8 * 100) / 100} (sotish narxi)</div>
          <button class="btn secondary" onclick="sellGift(${it.inventory_id})">Sotish</button>
        </div>
      `).join('');
    }

    async function sellGift(inventoryId) {
      const res = await fetch(`${API_BASE}/api/inventory/gifts/${inventoryId}/sell`, {
        method: 'POST',
        credentials: 'include',
      });
      const data = await res.json();
      if (!res.ok) {
        showToast(data.error || 'Xatolik');
        return;
      }
      currentUser.coin_balance = data.coin_balance;
      updateCoinBadge();
      showToast(`Sotildi! +${data.sold_for} coin`);
      loadInventory();
    }

    const bottomNav = document.getElementById('bottomNav');
    const moreNavButton = document.getElementById('moreNavButton');
    const moreSheet = document.getElementById('moreSheet');
    const moreBackdrop = document.getElementById('moreBackdrop');
    const closeMoreButton = document.getElementById('closeMoreButton');
    const moreTabs = new Set(['jonatmoq', 'mypet', 'kreditlar', 'profils']);

    function updateLiquidIndicator(tab) {
      const indicator = bottomNav?.querySelector('.nav-liquid-indicator');
      if (!indicator) return;
      const buttons = [...bottomNav.querySelectorAll('button[data-tab]')];
      const target = moreTabs.has(tab) ? moreNavButton : buttons.find(b => b.dataset.tab === tab) || buttons[0];
      if (!target) return;
      const navRect = bottomNav.getBoundingClientRect();
      const targetRect = target.getBoundingClientRect();
      const x = targetRect.left - navRect.left;
      const w = targetRect.width;
      const previousLeft = parseFloat(indicator.dataset.left || x);
      const distance = Math.abs(x - previousLeft);
      indicator.style.left = `${x}px`;
      indicator.style.width = `${w}px`;
      const stretch = Math.min(1.22, 1 + Math.min(distance / Math.max(w, 1), .22));
      indicator.style.transform = `translateX(0) scaleX(${stretch})`;
      indicator.style.borderRadius = stretch > 1.08 ? '24px' : '19px';
      clearTimeout(indicator._settleTimer);
      indicator._settleTimer = setTimeout(() => {
        indicator.style.transform = 'translateX(0) scaleX(1)';
        indicator.style.borderRadius = '19px';
      }, 430);
      indicator.dataset.left = x;
    }

    function setMoreOpen(open) {
      moreSheet.classList.toggle('open', open);
      moreBackdrop.classList.toggle('open', open);
      moreSheet.setAttribute('aria-hidden', String(!open));
      moreNavButton.setAttribute('aria-expanded', String(open));
    }

    function syncNavigation(tab) {
      document.querySelectorAll('#bottomNav button[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      moreNavButton.classList.toggle('active', moreTabs.has(tab));
      updateLiquidIndicator(tab);
    }

    // renderTab avvalgi funksiyasi ustidan navigation indikatorini sinxronlaydi.
    const _renderTab = renderTab;
    renderTab = async function(tab) {
      await _renderTab(tab);
      syncNavigation(tab);
      if (moreTabs.has(tab)) setMoreOpen(false);
    };

    bottomNav.querySelectorAll('button[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => renderTab(btn.dataset.tab));
    });
    moreNavButton.addEventListener('click', () => setMoreOpen(!moreSheet.classList.contains('open')));
    closeMoreButton.addEventListener('click', () => setMoreOpen(false));
    moreBackdrop.addEventListener('click', () => setMoreOpen(false));
    moreSheet.querySelectorAll('.more-item').forEach(btn => {
      btn.addEventListener('click', () => renderTab(btn.dataset.tab));
    });
    window.addEventListener('resize', () => {
      const active = document.querySelector('#bottomNav button.active')?.dataset.tab || 'shops';
      updateLiquidIndicator(active);
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') setMoreOpen(false); });

    // Dastlabki indikator joylashuvi.
    requestAnimationFrame(() => updateLiquidIndicator(location.hash.slice(1) || 'shops'));

    let shopCasesCache = {};

    async function loadShopCases() {
      const grid = document.getElementById('shopCaseGrid');
      grid.innerHTML = '<div class="empty-msg">Yuklanmoqda...</div>';
      const res = await fetch(`${API_BASE}/api/cases`, { credentials: 'include' });
      const list = await res.json();
      list.forEach(c => shopCasesCache[c.id] = c);
      if (!list.length) {
        grid.innerHTML = '<div class="empty-msg">Hozircha case\'lar yo\'q</div>';
        return;
      }
      grid.innerHTML = list.map(c => `
        <div class="gift-card">
          ${giftImg(c)}
          <div class="gift-name">${c.name}</div>
          <div class="gift-qty">${c.items.length} ta narsa</div>
          <div class="gift-price">🪙 ${c.price}</div>
          <button class="btn" onclick="openCaseInfoModal(${c.id})">Ko'rish</button>
        </div>
      `).join('');
    }

    function itemIcon(it) {
      if (it.item_type === 'coin') return `<div class="ci-icon">🪙</div>`;
      return it.gift_image_url
        ? `<img class="ci-icon" src="${it.gift_image_url}">`
        : `<div class="ci-icon">🎁</div>`;
    }

    function openCaseInfoModal(caseId) {
      const c = shopCasesCache[caseId];
      if (!c) return;
      const total = c.items.reduce((s, it) => s + it.chance_percent, 0);
      const rows = c.items.map(it => {
        const label = it.item_type === 'coin' ? `${it.coin_amount} coin` : it.gift_name;
        const pct = total > 0 ? Math.round(it.chance_percent / total * 1000) / 10 : 0;
        return `
          <div class="case-item-row">
            ${itemIcon(it)}
            <div class="ci-name">${label}</div>
            <div class="ci-chance">${pct}%</div>
          </div>`;
      }).join('');

      document.getElementById('modalBody').innerHTML = `
        <div class="modal-title">${c.name}</div>
        <div class="modal-sub">Ichida chiqishi mumkin bo'lgan narsalar:</div>
        ${rows}
        <button class="btn" style="margin-top:14px" onclick="buyCase(${c.id}, true)">Sotib olish — 🪙 ${c.price}</button>
      `;
      openModal();
    }

    function openModal() { document.getElementById('modalOverlay').classList.add('open'); }
    function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

    async function buyCase(caseId, fromModal) {
      if (actionInProgress) return;
      actionInProgress = true;
      try {
        const res = await fetch(`${API_BASE}/api/cases/${caseId}/buy`, { method: 'POST', credentials: 'include' });
        const data = await res.json();
        if (!res.ok) { showToast(data.error || 'Xatolik'); return; }
        currentUser.coin_balance = data.coin_balance;
        updateCoinBadge();
        if (fromModal) closeModal();
        showToast('Sotib olindi! Inventorga tushdi 📦');
        loadShopCases();
      } finally {
        actionInProgress = false;
      }
    }

    async function loadInventoryCases() {
      const grid = document.getElementById('invCaseGrid');
      grid.innerHTML = '<div class="empty-msg">Yuklanmoqda...</div>';
      const res = await fetch(`${API_BASE}/api/inventory/cases`, { credentials: 'include' });
      const items = await res.json();
      if (!items.length) {
        grid.innerHTML = '<div class="empty-msg">Case\'laringiz yo\'q</div>';
        return;
      }
      grid.innerHTML = items.map(it => `
        <div class="gift-card">
          ${giftImg(it)}
          <div class="gift-name">${it.name}</div>
          <button class="btn" onclick="openCase(${it.inventory_id}, ${it.case_id})">Ochish 🎉</button>
        </div>
      `).join('');
    }

    async function ensureCasesCache() {
      if (Object.keys(shopCasesCache).length) return;
      const res = await fetch(`${API_BASE}/api/cases`, { credentials: 'include' });
      const list = await res.json();
      list.forEach(c => shopCasesCache[c.id] = c);
    }

    function reelCellHTML(it) {
      if (!it) return `<div class="reel-cell">❓</div>`;
      if (it.item_type === 'coin') {
        return `<div class="reel-cell">🪙<div class="rc-label">${it.coin_amount} coin</div></div>`;
      }
      const img = it.gift_image_url
        ? `<img src="${it.gift_image_url}">`
        : `🎁`;
      return `<div class="reel-cell">${img}<div class="rc-label">${it.gift_name || ''}</div></div>`;
    }

    async function openCase(inventoryId, caseId) {
      await ensureCasesCache();
      const caseData = shopCasesCache[caseId];

      // Avval reel animatsiyasini ko'rsatamiz, keyin natijani serverdan olamiz
      document.getElementById('modalBody').innerHTML = `
        <div class="modal-title">Case ochilmoqda...</div>
        <div class="modal-sub">Omadingizni sinab ko'ring 🎲</div>
        <div class="reel-viewport">
          <div class="reel-marker"></div>
          <div class="reel-track" id="reelTrack"></div>
        </div>
      `;
      openModal();

      const res = await fetch(`${API_BASE}/api/inventory/cases/${inventoryId}/open`, {
        method: 'POST', credentials: 'include',
      });
      const data = await res.json();
      if (!res.ok) {
        document.getElementById('modalBody').innerHTML = `<div class="modal-title">Xatolik</div><div class="modal-sub">${data.error || ''}</div>`;
        return;
      }

      // Reel uchun tasodifiy narsalar ro'yxati, oxirida yutgan narsa
      const pool = (caseData && caseData.items.length) ? caseData.items : [data.won.item_type === 'coin'
        ? { item_type: 'coin', coin_amount: data.won.coin_amount }
        : { item_type: 'gift', gift_name: data.won.name, gift_image_url: data.won.image_url }];

      const LANDING_INDEX = 26;
      const TOTAL_CELLS = 30;
      const cells = [];
      for (let i = 0; i < TOTAL_CELLS; i++) {
        if (i === LANDING_INDEX) {
          cells.push(data.won.item_type === 'coin'
            ? { item_type: 'coin', coin_amount: data.won.coin_amount }
            : { item_type: 'gift', gift_name: data.won.name, gift_image_url: data.won.image_url });
        } else {
          cells.push(pool[Math.floor(Math.random() * pool.length)]);
        }
      }

      const track = document.getElementById('reelTrack');
      track.innerHTML = cells.map(reelCellHTML).join('');

      const cellWidth = 100; // 90 + 2*5 margin
      const targetX = -(LANDING_INDEX * cellWidth + cellWidth / 2);
      track.style.transition = 'none';
      track.style.transform = 'translateX(0px)';
      // keyingi freymda animatsiyani boshlaymiz
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          track.style.transition = 'transform 2.6s cubic-bezier(.12,.85,.15,1)';
          track.style.transform = `translateX(${targetX}px)`;
        });
      });

      currentUser.coin_balance = data.coin_balance;
      updateCoinBadge();

      setTimeout(() => {
        const win = data.won;
        const body = document.getElementById('modalBody');
        if (!body) return;
        const winMedia = win.item_type === 'coin'
          ? `<div class="win-icon">🪙</div>`
          : (win.image_url ? `<img src="${win.image_url}">` : `<div class="win-icon">🎁</div>`);
        const winText = win.item_type === 'coin' ? `${win.coin_amount} coin` : win.name;
        body.innerHTML = `
          <div class="win-reveal">
            ${winMedia}
            <div class="win-title">🎉 Siz yutdingiz!</div>
            <div class="modal-sub">${winText}</div>
            <button class="btn" onclick="closeModal(); loadInventoryCases(); loadInventory();">Ajoyib!</button>
          </div>
        `;
      }, 2900);
    }

    init();
  </script>
</body>
