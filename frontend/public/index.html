    // ---------- Tovush va tebranish (Personalizm) ----------
    let _actx = null;
    function _tone(f, d, t, v, type) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        const c = _actx || (_actx = new AC()); if (c.state === 'suspended') c.resume();
        const o = c.createOscillator(), g = c.createGain(), t0 = c.currentTime + (t || 0);
        o.type = type || 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(v || 0.06, t0 + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
        o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + d + 0.03);
      } catch (e) {}
    }
    function hap(kind) {
      const p = MTP.get();
      if (p.vibrate && navigator.vibrate) {
        try { navigator.vibrate(kind === 'win' ? [20, 50, 30, 50, 40] : kind === 'open' ? [14, 30, 14] : 8); } catch (e) {}
      }
      if (p.sound) {
        if (kind === 'tap') _tone(680, 0.05, 0, 0.035, 'triangle');
        else if (kind === 'open') { _tone(392, 0.12, 0, 0.06); _tone(523, 0.12, 0.09, 0.06); _tone(659, 0.2, 0.18, 0.06); }
        else if (kind === 'win') [523, 659, 784, 1047].forEach((f, i) => _tone(f, 0.22, i * 0.1, 0.07));
      }
    }

    // Rasm brauzerda 320x320 JPEG ga kichraytiriladi (odatda 20-50 KB), keyin serverga yuboriladi
    function resizeToSquareJpeg(file, size) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          try {
            const side = Math.min(img.naturalWidth, img.naturalHeight);
            const sx = (img.naturalWidth - side) / 2, sy = (img.naturalHeight - side) / 2;
            const c = document.createElement('canvas');
            c.width = c.height = size;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, size, size);   // shaffof PNG uchun
            ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
            c.toBlob((b) => { URL.revokeObjectURL(url); b ? resolve(b) : reject(new Error('toBlob')); }, 'image/jpeg', 0.85);
          } catch (e) { URL.revokeObjectURL(url); reject(e); }
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('rasm ochilmadi')); };
        img.src = url;
      });
    }

    async function uploadAvatar(file) {
      const err = document.getElementById('pfAvatarErr');
      err.textContent = '';
      if (!/^image\/(jpeg|png|webp)$/.test(file.type)) { err.textContent = 'Faqat JPG, PNG yoki WEBP rasm tanlang'; return; }
      if (file.size > 15 * 1024 * 1024) { err.textContent = 'Rasm juda katta (15 MB dan kichik tanlang)'; return; }
      err.style.color = 'var(--muted)'; err.textContent = 'Yuklanmoqda...';
      try {
        const blob = await resizeToSquareJpeg(file, 320);
        const fd = new FormData();
        fd.append('avatar', blob, 'avatar.jpg');
        const res = await fetch(`${API_BASE}/api/profile/avatar`, { method: 'POST', credentials: 'include', body: fd });
        let data = {}; try { data = await res.json(); } catch (e) {}
        if (!res.ok) { err.style.color = ''; err.textContent = data.error || 'Xatolik'; return; }
        await refreshMe();
        showToast('Rasm yangilandi 📷');
        openProfilePage();
      } catch (e) {
        err.style.color = ''; err.textContent = "Rasmni yuklab bo'lmadi. Boshqa rasm tanlab ko'ring.";
      }
    }

    // "Yuklab olish" — chiroyli animatsiya (12-15 soniya). Haqiqiy almashtirish animatsiya

    function verEsc(t) {
      return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    async function loadVersionCard() {
      const wrap = document.getElementById('versionWrap');

      try {
        const res = await fetch(`${API_BASE}/api/versions/me`, { credentials: 'include' });
        if (!res.ok) { wrap.innerHTML = ''; return; }
        const data = await res.json();
        const curCard = `<div class="st-card"><div style="font-weight:700;">Hozirgi versiya: V${verEsc(data.current)}</div>${data.available.length ? '' : '<div class="send-hint">Yangi versiya yo\'q.</div>'}</div>`;
        wrap.innerHTML = curCard + `
          ${data.available.map(v => `
            <div class="gift-card" style="text-align:left; padding:16px; margin-bottom:12px;" id="verCard-${verEsc(v.version)}">
              <div style="font-weight:700; margin-bottom:4px;">
                MTshop V${verEsc(v.version)}${v.title ? ' — ' + verEsc(v.title) : ''}
                ${v.status !== 'public' ? `<span class="ver-tag">${v.status === 'beta' ? 'BETA' : 'DRAFT'}</span>` : ''}
              </div>
              ${v.changelog ? `<div class="modal-sub" style="white-space:pre-line; margin-bottom:12px;">${verEsc(v.changelog)}</div>` : ''}
              <div id="verAction-${verEsc(v.version)}">
                <button class="btn" onclick="startVersionDownload('${verEsc(v.version)}')">⬇️ Yuklab olish</button>
              </div>
            </div>
          `).join('')}
        `;
      } catch (e) { wrap.innerHTML = ''; /* tarmoq xatosi — kartani ko'rsatmaymiz */ }
    }

    let versionDownloading = false;

    function startVersionDownload(version) {
      if (versionDownloading) return;
      versionDownloading = true;

      const box = document.getElementById('verAction-' + version);
      box.innerHTML = `
        <div class="modal-sub" id="verStage-${version}" style="margin:0;">Fayllar tayyorlanmoqda...</div>
        <div class="ver-bar"><div id="verFill-${version}"></div></div>
        <div class="modal-sub" id="verPct-${version}" style="margin:0;">0%</div>
      `;
      const fill = document.getElementById('verFill-' + version);
      const pct = document.getElementById('verPct-' + version);
      const stage = document.getElementById('verStage-' + version);

      const duration = 12000 + Math.random() * 3000; // 12-15 soniya
      const t0 = performance.now();

      function tick(now) {
        const p = Math.min((now - t0) / duration, 1);
        fill.style.width = (p * 100) + '%';
        pct.textContent = Math.floor(p * 100) + '%';
        stage.textContent = p < 0.55 ? 'Fayllar tayyorlanmoqda...' : (p < 0.9 ? "O'rnatilmoqda..." : 'Yakunlanmoqda...');
        if (p < 1) { requestAnimationFrame(tick); return; }
        finishVersionDownload(version, box);
      }
      requestAnimationFrame(tick);
    }

    // Animatsiya tugagach — faqat shu yerda serverga so'rov ketadi (sahifa yopilsa versiya o'zgarmaydi)
    async function finishVersionDownload(version, box) {
      try {
        const res = await fetch(`${API_BASE}/api/versions/switch`, {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ version }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Xatolik');
        box.innerHTML = '<div style="font-weight:700;">✅ Tayyor! Sahifa yangilanmoqda...</div>';
        setTimeout(() => location.reload(), 700);
      } catch (e) {
        versionDownloading = false;
        showToast(e.message || 'Xatolik');
        box.innerHTML = `<button class="btn" onclick="startVersionDownload('${version}')">⬇️ Qayta urinish</button>`;
      }
    }

    // =====================================================================
    // GIFT TRADE
    // Hamma qoidalar (vaqt, cooldown, lock, tekshiruv) serverda. Bu yerda faqat ko'rsatish va tugmalar.
    // Foydalanuvchi matnlari (username, chat, gift nomi) HECH QACHON xom HTML sifatida qo'yilmaydi:
    // esc() yoki textContent ishlatiladi.
    // =====================================================================
    let tradeOffset = 0;               // server vaqti - brauzer vaqti (faqat countdown ko'rsatish uchun)
    let tradeSummary = null;
    let tradeCurrentTab = 'shops';
    let tradePollTimer = null;
    let tradeTickTimer = null;
    let tradeBannerKey = '';
    let tradeBusy = false;
    let tradeRoom = null;              // { id, lastMsgId, timer, key, readonly }

    const TRADE_STATUS_UZ = {
      PENDING: '⏳ Kutilmoqda', ACTIVE: '🟢 Faol', REJECTED: '❌ Rad etilgan', CANCELLED: '❌ Bekor qilingan',
      EXPIRED: '⌛ Muddati tugagan', COMPLETED: '✅ Yakunlangan', FAILED: '⚠️ Bajarilmadi',
    };

    async function tradeApi(method, path, body) {
      const opts = { method, credentials: 'include' };
      if (body !== undefined) { opts.headers = { 'Content-Type': 'application/json' }; opts.body = JSON.stringify(body); }
      try {
        const res = await fetch(`${API_BASE}/api/trades${path}`, opts);
        let data = {};
        try { data = await res.json(); } catch (e) {}
        return { ok: res.ok, status: res.status, data };
      } catch (e) {
        return { ok: false, status: 0, data: { error: "Tarmoq xatosi. Qayta urinib ko'ring." } };
      }
    }

    const tradeNow = () => Date.now() + tradeOffset;
    function fmtCountdown(ms) {
      const sec = Math.max(0, Math.ceil(ms / 1000));
      return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    }

    function tradeGiftThumb(giftId) {
      if (!giftId) return `<span class="tr-thumb">🎁</span>`;
      return `<span class="tr-thumb"><img src="${API_BASE}/api/gift-image/${Number(giftId)}" alt="" loading="lazy" onerror="this.parentNode.textContent='🎁'"></span>`;
    }


    // =====================================================================
    // EMOJI STATUS va QADALGAN GIFTLAR (Profils > Profile edit)
    // =====================================================================
    function emojiBadge(giftId) {
      const id = Number(giftId);
      if (!id) return '';
      return `<span class="emo-st"><img src="${API_BASE}/api/gift-image/${id}" alt="" loading="lazy" onerror="this.parentNode.remove()"></span>`;
    }

    async function profileApi(method, path, body) {
      const opts = { method, credentials: 'include' };
      if (body !== undefined) { opts.headers = { 'Content-Type': 'application/json' }; opts.body = JSON.stringify(body); }
      try {
        const res = await fetch(`${API_BASE}/api/profile${path}`, opts);
        let data = {};
        try { data = await res.json(); } catch (e) {}
        return { ok: res.ok, status: res.status, data };
      } catch (e) {
        return { ok: false, status: 0, data: { error: "Tarmoq xatosi. Qayta urinib ko'ring." } };
      }
    }

          openEmojiStatus();

      const clr = document.getElementById('peEmojiClear');
      if (clr) clr.addEventListener('click', async () => {

        if (!rr.ok) { showToast(rr.data.error || 'Xatolik'); return; }
        showToast('Emoji status olib tashlandi');

    // Qadalgan giftlar
    async function openPinGifts() {
      document.getElementById('modalBody').innerHTML = `<div class="modal-title">Yuklanmoqda...</div>`;
      openPage('Qadalgan giftlar', openProfilePage);
      const r = await profileApi('GET', '/edit');
      if (!r.ok) return profileEditError(r);
      const d = r.data;
      const full = d.pins.length >= d.limits.pin_max;
      const pinned = d.pins.length
        ? d.pins.map(p => `
            <div class="tr-pick-row" style="cursor:default" data-ugrow="${Number(p.user_gift_id)}">
              ${tradeGiftThumb(p.gift_id)}
              <div class="tr-name">${esc(p.name)}</div>
              ${d.pins.length > 1 ? `<div class="pz-mv"><button type="button" data-mv="up" aria-label="Yuqoriga">▲</button><button type="button" data-mv="down" aria-label="Pastga">▼</button></div>` : ''}
              <button class="tr-del" aria-label="Olib tashlash" data-ug="${Number(p.user_gift_id)}">✕</button>
            </div>`).join('')
        : `<div class="modal-sub">Hali gift qadalmagan.</div>`;
      document.getElementById('modalBody').innerHTML = `
        <div class="modal-title">Gift 📌</div>
        <div class="modal-sub" style="margin-bottom:0">Profilingizda hamma ko'radigan giftlar (${d.pins.length}/${d.limits.pin_max}). Narxi ${d.limits.pin_min_price} coin va undan yuqori giftlar qadaladi.</div>
        <div class="tr-pick-list">${pinned}</div>
        <button class="btn" id="pePinAdd" ${full ? 'disabled' : ''}>📌 Gift qadash</button>
        <button class="btn-back" onclick="openProfilePage()">&larr; Orqaga</button>
      `;
      document.getElementById('pePinAdd').addEventListener('click', () => openPinPicker(d));
      document.querySelectorAll('#modalBody .pz-mv button').forEach(b => b.addEventListener('click', async () => {
        const row = b.closest('.tr-pick-row'), list = row.parentNode;
        const sib = b.dataset.mv === 'up' ? row.previousElementSibling : row.nextElementSibling;
        if (!sib) return;
        if (b.dataset.mv === 'up') list.insertBefore(row, sib); else list.insertBefore(sib, row);
        const ids = [...list.querySelectorAll('.tr-pick-row[data-ugrow]')].map(x => Number(x.dataset.ugrow));
        const rr = await profileApi('PUT', '/pins/order', { user_gift_ids: ids });
        if (!rr.ok) { showToast(rr.data.error || 'Xatolik'); openPinGifts(); }
      }));
      document.querySelectorAll('#modalBody .tr-del[data-ug]').forEach(b => {
        b.addEventListener('click', async () => {
          const rr = await profileApi('DELETE', `/pins/${Number(b.dataset.ug)}`);

          showToast('Qadash olib tashlandi');

    function openPinPicker(d) {
      const rows = d.pin_options.length
        ? d.pin_options.map(g => `
            <div class="tr-pick-row" data-ug="${Number(g.user_gift_id)}">
              ${tradeGiftThumb(g.gift_id)}
              <div class="tr-name">${esc(g.name)}</div>
              <div class="tr-price"><img class="cn" src="icons/coin.png" alt="coin"> ${esc(g.price)}</div>
              <div class="tr-add">📌 Qadash</div>
            </div>`).join('')
        : `<div class="modal-sub">Qadash uchun narxi ${d.limits.pin_min_price} coin va undan yuqori bo'sh gift yo'q.</div>`;
      document.getElementById('modalBody').innerHTML = `
        <div class="modal-title">📌 Gift tanlang</div>
        <div class="tr-pick-list">${rows}</div>
        <button class="btn-back" onclick="openPinGifts()">&larr; Orqaga</button>
      `;
      openPage('Gift tanlang', openPinGifts);
      document.querySelectorAll('#modalBody .tr-pick-row[data-ug]').forEach(el => {
        el.addEventListener('click', async () => {
          const rr = await profileApi('POST', '/pins', { user_gift_id: Number(el.dataset.ug) });
          if (!rr.ok) { showToast(rr.data.error || 'Xatolik'); return; }
          showToast('Gift profilga qadaldi 📌');
          openPinGifts();
        });
      });
    }

    // ---------- Global: request banner + bildirishnomalar ----------

    function startTradePolling() {
      if (tradePollTimer) return;
      pollTrades();
      tradePollTimer = setInterval(pollTrades, 7000);
      tradeTickTimer = setInterval(tradeTick, 1000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) pollTrades(); });
    }

    async function pollTrades() {
      const r = await tradeApi('GET', '/summary');
      if (!r.ok) return;
      const s = r.data;
      tradeOffset = s.server_now - Date.now();
      const hadActive = tradeSummary && tradeSummary.active ? tradeSummary.active.id : null;
      tradeSummary = s;
      renderTradeBanner();

      if (s.notifications && s.notifications.length) {
        s.notifications.forEach((n, i) => setTimeout(() => showToast(n.text), i * 2400));
        tradeApi('POST', '/notifications/seen', { ids: s.notifications.map(n => n.id) });
        if (s.notifications.some(n => ['completed', 'failed', 'cancelled'].includes(n.type))) refreshMe();
      }
      if (hadActive && !s.active) refreshMe();
      if (tradeCurrentTab === 'trade' && !tradeRoom) updateTradeHomeLive();
    }

    function tradeTick() {
      const now = tradeNow();
      document.querySelectorAll('[data-exp]').forEach(el => {
        const left = new Date(el.dataset.exp).getTime() - now;
        el.textContent = fmtCountdown(left);
        if (left <= 0 && !el.dataset.done) { el.dataset.done = '1'; pollTrades(); }
      });
      document.querySelectorAll('[data-cd]').forEach(el => {
        const left = Number(el.dataset.cd) - now;
        el.textContent = fmtCountdown(left);
        if (left <= 0 && !el.dataset.done) { el.dataset.done = '1'; pollTrades(); }
      });
    }

    function renderTradeBanner() {
      let box = document.getElementById('tradeBanner');
      if (!box) { box = document.createElement('div'); box.id = 'tradeBanner'; document.body.appendChild(box); }
      const s = tradeSummary;
      if (!s || document.getElementById('app').style.display === 'none') { box.innerHTML = ''; return; }

      const inRoomOfActive = tradeRoom && s.active && tradeRoom.id === s.active.id;
      const parts = [];
      (s.incoming || []).forEach(t => {
        parts.push(`
          <div class="tb">
            <div class="tb-t">🔄 @${esc(t.from_username)}${emojiBadge(t.emoji_gift_id)} siz bilan Trade boshlamoqchi.</div>
            <div class="tb-s">Muddati: <span data-exp="${esc(t.expires_at)}"></span></div>
            <div class="tb-b">
              <button class="btn good" onclick="tradeAccept(${t.id})">Qabul qilish</button>
              <button class="btn secondary" onclick="tradeReject(${t.id})">Rad etish</button>
            </div>
          </div>`);
      });
      if (s.outgoing) {
        parts.push(`
          <div class="tb">
            <div class="tb-t">⏳ @${esc(s.outgoing.to_username)}${emojiBadge(s.outgoing.emoji_gift_id)} javobini kutyapmiz</div>
            <div class="tb-s">Request muddati: <span data-exp="${esc(s.outgoing.expires_at)}"></span></div>
            <div class="tb-b"><button class="btn secondary" onclick="tradeCancelRequest(${s.outgoing.id})">Requestni bekor qilish</button></div>
          </div>`);
      }
      if (s.active && !inRoomOfActive) {
        parts.push(`
          <div class="tb">
            <div class="tb-t">🔄 Trade #${s.active.id} davom etmoqda — @${esc(s.active.with)}${emojiBadge(s.active.emoji_gift_id)}</div>
            <div class="tb-b"><button class="btn" onclick="openTradeRoom(${s.active.id})">Trade'ni ochish</button></div>
          </div>`);
      }
      const html = parts.join('');
      const key = html;
      if (key !== tradeBannerKey) { tradeBannerKey = key; box.innerHTML = html; tradeTick(); }
    }

    async function tradeAccept(id) {
      if (tradeBusy) return; tradeBusy = true;
      const r = await tradeApi('POST', `/${id}/accept`);
      tradeBusy = false;
      if (!r.ok) { showToast(r.data.error || 'Xatolik'); pollTrades(); return; }
      showToast('Trade boshlandi!');
      await pollTrades();
      openTradeRoom(id);
    }

    async function tradeReject(id) {
      if (tradeBusy) return; tradeBusy = true;
      const r = await tradeApi('POST', `/${id}/reject`);
      tradeBusy = false;
      showToast(r.ok ? 'Request rad etildi' : (r.data.error || 'Xatolik'));
      pollTrades();
    }

    async function tradeCancelRequest(id) {
      if (tradeBusy) return; tradeBusy = true;
      const r = await tradeApi('POST', `/${id}/cancel`);
      tradeBusy = false;
      showToast(r.ok ? 'Request bekor qilindi' : (r.data.error || 'Xatolik'));
      pollTrades();
    }

    // ---------- Request yuborish ----------

    function confirmTradeRequest(username) {
      document.getElementById('modalBody').innerHTML = `
        <div class="modal-title">🔄 Trade Request</div>
        <div class="modal-sub">@${esc(username)} bilan Trade boshlashni xohlaysizmi?</div>
        <div class="modal-sub" style="font-size:12px">Request 5 daqiqa amal qiladi. Yangi request 20 daqiqada faqat bir marta yuboriladi.</div>
        <button class="btn" id="trSendReqBtn" data-u="${esc(username)}">Send Request</button>
        <button class="btn-back" onclick="closeModal()">Bekor qilish</button>
        <div class="msg" id="trReqMsg"></div>
      `;
      openModal();
      document.getElementById('trSendReqBtn').addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        if (btn.disabled) return;
        btn.disabled = true;
        const r = await tradeApi('POST', '/request', { username: btn.dataset.u });
        if (!r.ok) {
          const m = document.getElementById('trReqMsg');
          m.textContent = r.data.error || 'Xatolik'; m.className = 'msg error';
          btn.disabled = false;
          return;
        }
        closeModal();
        showToast(`Request @${btn.dataset.u} ga yuborildi`);
        pollTrades();
        if (tradeCurrentTab === 'trade' && !tradeRoom) renderTradeHome(document.getElementById('main'));
      });
    }

    // ---------- Trade sahifasi (Yana > Trade) ----------

    async function renderTradeHome(main) {
      main.innerHTML = `
        <div class="page-title">Trade</div>
        <div class="page-sub">Do'stingiz bilan gift va coin almashing. Xavfsiz va ikki tomonlama tasdiqlanadi.</div>
        <div id="trHomeLive"></div>
        <div class="tr-card">
          <div class="section-title">🔄 Yangi Trade</div>
          <input type="text" class="send-input" id="trNewUser" placeholder="Foydalanuvchi username" autocapitalize="none" autocomplete="off" maxlength="64">
          <button class="btn" style="margin-top:10px" onclick="startTradeFromHome()">Trade boshlash</button>
        </div>
        <div class="section-title" style="margin-top:6px">🕘 Trade tarixi</div>
        <div id="trHistory"><div class="empty-msg">Yuklanmoqda...</div></div>
      `;
      await pollTrades();
      updateTradeHomeLive();
      loadTradeHistory();
    }

    function startTradeFromHome() {
      const u = document.getElementById('trNewUser').value.trim().replace(/^@/, '');
      if (!u) { showToast('Username kiriting'); return; }
      confirmTradeRequest(u);
    }

    function updateTradeHomeLive() {
      const el = document.getElementById('trHomeLive');
      if (!el || !tradeSummary) return;
      const s = tradeSummary;
      let html = '';
      if (s.active) {
        html += `<div class="tr-card"><div class="section-title">🟢 Faol Trade</div>
          <div class="modal-sub" style="margin-bottom:10px">Trade #${s.active.id} — @${esc(s.active.with)}${emojiBadge(s.active.emoji_gift_id)}</div>
          <button class="btn" onclick="openTradeRoom(${s.active.id})">Ochish</button></div>`;
      }
      if (s.cooldown_until && s.cooldown_until > tradeNow()) {
        html += `<div class="tr-card"><div class="modal-sub" style="margin:0">⏳ Yangi request yuborish uchun: <b data-cd="${s.cooldown_until}"></b></div></div>`;
      }
      if (el.dataset.k !== html) { el.dataset.k = html; el.innerHTML = html; tradeTick(); }
    }

    async function loadTradeHistory() {
      const box = document.getElementById('trHistory');
      const r = await tradeApi('GET', '/history');
      if (!box) return;
      if (!r.ok) { box.innerHTML = `<div class="empty-msg">${esc(r.data.error || 'Xatolik')}</div>`; return; }
      if (!r.data.length) { box.innerHTML = '<div class="empty-msg">Hozircha Trade yo\'q</div>'; return; }
      box.innerHTML = r.data.map(t => {
        const mine = [...t.my_gifts, ...(t.my_coin ? [`${t.my_coin} coin`] : [])].join(', ') || '—';
        const theirs = [...t.their_gifts, ...(t.their_coin ? [`${t.their_coin} coin`] : [])].join(', ') || '—';
        const canDelete = t.status !== 'ACTIVE';
        return `<div class="tr-hist" onclick="openTradeRoom(${t.id}, true)">
          <div class="tr-h-main">
            <div><b>Trade #${t.id}</b> · @${esc(t.with)}</div>
            <div class="tr-h-sub">${esc(mine)} ⇄ ${esc(theirs)}</div>
          </div>
          <span class="tr-badge ${esc(t.status)}">${TRADE_STATUS_UZ[t.status] || esc(t.status)}</span>
          ${canDelete ? `<button class="tr-del" aria-label="Tarixdan o'chirish" onclick="event.stopPropagation(); tradeDeleteHistory(${t.id})">🗑</button>` : ''}
        </div>`;
      }).join('') + `<div style="text-align:center; margin-top:6px"><button class="tr-linkbtn" onclick="tradeClearHistory()">Barcha tarixni tozalash</button></div>`;
    }

    async function tradeDeleteHistory(id, fromRoom) {
      if (!confirm("Bu Trade tarixdan o'chirilsinmi? (Faqat sizning tarixingizdan o'chadi, sherikda qoladi.)")) return;
      const r = await tradeApi('DELETE', `/${Number(id)}/history`);
      if (!r.ok) { showToast(r.data.error || 'Xatolik'); return; }
      showToast("Tarixdan o'chirildi");
      if (fromRoom) renderTab('trade'); else loadTradeHistory();
    }

    async function tradeClearHistory() {
      if (!confirm("Barcha tugagan Trade'lar tarixingizdan o'chirilsinmi? (Faol Trade'lar o'chmaydi.)")) return;
      const r = await tradeApi('DELETE', '/history');
      if (!r.ok) { showToast(r.data.error || 'Xatolik'); return; }
      showToast(r.data.count ? `${r.data.count} ta Trade tarixdan o'chirildi` : "O'chiriladigan Trade yo'q");
      loadTradeHistory();
    }

    // ---------- Trade xonasi ----------

    function stopTradeRoom() {
      if (tradeRoom && tradeRoom.timer) clearInterval(tradeRoom.timer);
      tradeRoom = null;
    }

    async function openTradeRoom(id, readonly) {
      closeModal();
      stopTradeRoom();
      tradeCurrentTab = 'trade';
      document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === 'trade'));
      const main = document.getElementById('main');
      main.innerHTML = `
        <button class="btn-back" onclick="renderTab('trade')">&larr; Trade bo'limi</button>
        <div class="tr-head">
          <div class="page-title" id="trTitle" style="margin:0">🔄 Trade #${Number(id)}</div>
          <span class="tr-badge" id="trStatus"></span>
        </div>
        <div class="tr-vs" id="trVs"></div>
        <div id="trResult"></div>

        <div class="tr-card">
          <div class="section-title">💬 Trade Chat</div>
          <div class="tr-chat" id="trChat"><div class="tr-msg-empty" id="trChatEmpty">Hali xabar yo'q</div></div>
          <div class="tr-send" id="trSendRow">
            <input type="text" class="send-input" id="trMsgInput" maxlength="500" placeholder="Xabar yozing..." autocomplete="off">
            <button class="btn" id="trMsgBtn">Yuborish</button>
          </div>
        </div>

        <div class="tr-card" id="trMine"></div>
        <div class="tr-card" id="trTheirs"></div>
        <div id="trActions"></div>
      `;
      tradeRoom = { id: Number(id), lastMsgId: 0, timer: null, key: '', readonly: !!readonly, data: null };
      document.getElementById('trMsgBtn').addEventListener('click', sendTradeMessage);
      document.getElementById('trMsgInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendTradeMessage(); });
      renderTradeBanner();
      const ok = await refreshTradeRoom();
      if (!ok) return;
      if (tradeRoom && !tradeRoom.readonly && tradeRoom.data && tradeRoom.data.trade.status === 'ACTIVE') {
        tradeRoom.timer = setInterval(refreshTradeRoom, 2500);
      }
    }

    async function refreshTradeRoom() {
      const room = tradeRoom;
      if (!room) return false;
      const r = await tradeApi('GET', `/${room.id}?after=${room.lastMsgId}`);
      if (tradeRoom !== room) return false;
      if (!r.ok) {
        if (r.status === 403 || r.status === 404) {
          stopTradeRoom();
          document.getElementById('main').innerHTML = `<div class="empty-msg">${esc(r.data.error || 'Trade topilmadi')}</div><button class="btn secondary" onclick="renderTab('trade')">Orqaga</button>`;
        }
        return false;
      }
      const d = r.data;
      tradeOffset = d.server_now - Date.now();
      room.data = d;
      appendTradeMessages(d);
      renderTradeRoom(d);
      if (d.trade.status !== 'ACTIVE' && room.timer) { clearInterval(room.timer); room.timer = null; refreshMe(); pollTrades(); }
      return true;
    }

    function appendTradeMessages(d) {
      const chat = document.getElementById('trChat');
      if (!chat || !d.messages.length) return;
      const nearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 60;
      const empty = document.getElementById('trChatEmpty');
      if (empty) empty.remove();
      d.messages.forEach(m => {
        const row = document.createElement('div');
        row.className = 'tr-msg' + (m.user_id === d.me.id ? ' me' : '');
        const b = document.createElement('b');
        b.textContent = '@' + m.username + ': ';
        const t = document.createElement('span');
        t.textContent = m.body;                  // textContent: HTML/JS injection mumkin emas
        row.appendChild(b); row.appendChild(t);
        chat.appendChild(row);
        tradeRoom.lastMsgId = Math.max(tradeRoom.lastMsgId, m.id);
      });
      if (nearBottom || d.messages.some(m => m.user_id === d.me.id)) chat.scrollTop = chat.scrollHeight;
    }

    async function sendTradeMessage() {
      const input = document.getElementById('trMsgInput');
      const btn = document.getElementById('trMsgBtn');
      if (!input || !tradeRoom || btn.disabled) return;
      const text = input.value.trim();
      if (!text) return;
      btn.disabled = true;
      const r = await tradeApi('POST', `/${tradeRoom.id}/messages`, { text });
      btn.disabled = false;
      if (!r.ok) { showToast(r.data.error || 'Xatolik'); return; }
      input.value = '';
      refreshTradeRoom();
    }

    function tradeOfferHtml(side, canEdit) {
      const gifts = side.gifts.length
        ? side.gifts.map(g => `
            <div class="tr-offer-row ${g.missing ? 'missing' : ''}">
              ${tradeGiftThumb(g.gift_id)}
              <div class="tr-name">${esc(g.name)}${g.missing ? ' (mavjud emas)' : ''}</div>
              ${canEdit ? `<button class="tr-x" aria-label="Olib tashlash" onclick="tradeRemoveGift(${g.user_gift_id})">✕</button>` : ''}
            </div>`).join('')
        : '';
      const coin = side.coin > 0
        ? `<div class="tr-offer-row"><span class="tr-thumb">💰</span><div class="tr-name">${side.coin} coin</div></div>` : '';
      return (gifts || coin) ? gifts + coin : `<div class="tr-empty">Hali hech narsa taklif qilinmagan</div>`;
    }

    function renderTradeRoom(d) {
      const t = d.trade;
      document.getElementById('trStatus').textContent = TRADE_STATUS_UZ[t.status] || t.status;
      document.getElementById('trStatus').className = 'tr-badge ' + t.status;
      const vsEl = document.getElementById('trVs');
      const vsHtml = `@${esc(d.me.username)}${emojiBadge(d.me.emoji_gift_id)} ↔ @${esc(d.other.username)}${emojiBadge(d.other.emoji_gift_id)}`;
      if (vsEl.dataset.k !== vsHtml) { vsEl.dataset.k = vsHtml; vsEl.innerHTML = vsHtml; }   // faqat o'zgarsa (rasm qayta yuklanmasin)

      const active = t.status === 'ACTIVE';
      const result = document.getElementById('trResult');
      const resMap = {
        COMPLETED: ['ok', `🎉 Trade #${t.id} muvaffaqiyatli yakunlandi.`],
        CANCELLED: ['bad', "Trade bekor qilindi. Gift va coinlar egalariga qaytarildi."],
        FAILED: ['bad', "Trade bajarilmadi. Gift va coinlar egalariga qaytarildi."],
        REJECTED: ['bad', 'Trade rad etilgan.'],
        EXPIRED: ['bad', 'Trade Request muddati tugagan.'],
      };
      result.innerHTML = resMap[t.status] ? `<div class="tr-result ${resMap[t.status][0]}">${resMap[t.status][1]}</div>` : '';

      document.getElementById('trSendRow').style.display = active ? 'flex' : 'none';

      // Offer / tugmalar faqat o'zgarganda qayta chiziladi (kiritish maydonlari fokusini yo'qotmaslik uchun)
      const key = JSON.stringify([t.status, d.my, d.their, d.can]);
      if (key === tradeRoom.key) return;
      tradeRoom.key = key;

      const my = d.my, their = d.their;
      document.getElementById('trMine').innerHTML = `
        <div class="section-title">🎁 Sizning offeringiz</div>
        ${tradeOfferHtml(my, d.can.edit)}
        <div class="tr-lock ${my.locked ? 'on' : 'off'}">${my.locked ? '🔒 Locked' : '✏️ Tahrirlanmoqda'}${my.confirmed ? ' · ✅ Tasdiqlagansiz' : ''}</div>
        ${active ? `<div class="tr-btns">
          ${d.can.edit ? `<button class="btn secondary" onclick="openOfferPicker()">+ Add Offer</button>` : ''}
          ${d.can.lock ? `<button class="btn" onclick="tradeLock()">🔒 Lock Offer</button>` : ''}
          ${d.can.unlock ? `<button class="btn secondary" onclick="tradeUnlock()">🔓 Unlock &amp; Edit</button>` : ''}
        </div>` : ''}
      `;
      document.getElementById('trTheirs').innerHTML = `
        <div class="section-title">🎁 @${esc(d.other.username)} offeri</div>
        ${tradeOfferHtml(their, false)}
        <div class="tr-lock ${their.locked ? 'on' : 'off'}">${their.locked ? '🔒 Locked' : '✏️ Tahrirlanmoqda'}${their.confirmed ? ' · ✅ Tasdiqlagan' : ''}</div>
      `;

      let actions = '';
      if (active) {
        const waiting = my.confirmed && !their.confirmed;
        actions = `<div class="tr-btns">
          <button class="btn good" id="trConfirmBtn" ${d.can.confirm ? '' : 'disabled'} onclick="openTradeConfirm()">${waiting ? '⏳ Sherik tasdiqlashini kutyapmiz' : 'Confirm Trade'}</button>
          <button class="btn danger" onclick="tradeCancelActive()">Cancel Trade</button>
        </div>
        <div class="send-hint" style="margin:8px 2px 0">${!(my.locked && their.locked) ? 'Confirm uchun ikkala tomon ham offerni Lock qilishi kerak.' : ''}</div>`;
      }
      if (!active && t.status !== 'PENDING') {
        actions = `<div class="tr-btns"><button class="btn secondary" onclick="tradeDeleteHistory(${t.id}, true)">🗑 Tarixdan o'chirish</button></div>`;
      }
      document.getElementById('trActions').innerHTML = actions;
    }

    // ---------- Offer amallari ----------

    async function tradeAction(method, path, body, okMsg) {
      if (!tradeRoom || tradeBusy) return null;
      tradeBusy = true;
      const r = await tradeApi(method, `/${tradeRoom.id}${path}`, body);
      tradeBusy = false;
      if (!r.ok) showToast(r.data.error || 'Xatolik');
      else if (okMsg) showToast(okMsg);
      await refreshTradeRoom();
      return r;
    }

    const tradeLock = () => tradeAction('POST', '/lock', {}, null);
    const tradeUnlock = () => tradeAction('POST', '/unlock', {}, null);
    const tradeRemoveGift = (ugId) => tradeAction('DELETE', `/offer/gift/${Number(ugId)}`, undefined, null);

    // 1-qadam: "Qaysi birini tanlaysiz?" — pastda ikkita tugma: Gift, Coin
    function openOfferPicker() {
      if (!tradeRoom || !tradeRoom.data) return;
      const d = tradeRoom.data;
      const left = d.limits.max_gifts - d.my.gifts.length;
      document.getElementById('modalBody').innerHTML = `
        <div class="modal-title">Qaysi birini tanlaysiz?</div>
        <div class="modal-sub">Offeringizga nima qo'shmoqchisiz?</div>
        <div class="send-hint">🎁 Gift: yana ${Math.max(left, 0)} ta (maks. ${d.limits.max_gifts}) &middot; 💰 Coin: hozir ${d.my.coin}</div>
        <div class="tr-choice">
          <button class="btn" id="trPickGift" ${left <= 0 ? 'disabled' : ''}>🎁 Gift</button>
          <button class="btn" id="trPickCoin">💰 Coin</button>
        </div>
        <button class="btn-back" onclick="closeModal()">Yopish</button>
      `;
      openModal();
      document.getElementById('trPickGift').addEventListener('click', openOfferGiftList);
      document.getElementById('trPickCoin').addEventListener('click', openOfferCoin);
    }

    // 2a-qadam: gift ro'yxati (ixcham qatorlar, kichik rasm)
    async function openOfferGiftList() {
      if (!tradeRoom || !tradeRoom.data) return;
      const d = tradeRoom.data;
      document.getElementById('modalBody').innerHTML = `<div class="modal-title">Yuklanmoqda...</div>`;
      const r = await tradeApi('GET', '/available-gifts');
      if (!r.ok) { document.getElementById('modalBody').innerHTML = `<div class="modal-title">Xatolik</div><div class="modal-sub">${esc(r.data.error || '')}</div><button class="btn-back" onclick="openOfferPicker()">&larr; Orqaga</button>`; return; }
      const left = d.limits.max_gifts - d.my.gifts.length;
      const rows = r.data.length
        ? r.data.map(g => `
            <div class="tr-pick-row" onclick="tradeAddGift(${g.user_gift_id})">
              ${tradeGiftThumb(g.gift_id)}
              <div class="tr-name">${esc(g.name)}</div>
              <div class="tr-add">+ Qo'shish</div>
            </div>`).join('')
        : `<div class="modal-sub">Offerga qo'sha oladigan bo'sh gift yo'q.</div>`;
      document.getElementById('modalBody').innerHTML = `
        <div class="modal-title">🎁 Gift tanlang</div>
        <div class="modal-sub" style="margin-bottom:0">Yana ${Math.max(left, 0)} ta qo'sha olasiz.</div>
        <div class="tr-pick-list">${rows}</div>
        <button class="btn-back" onclick="openOfferPicker()">&larr; Orqaga</button>
      `;
    }

    // 2b-qadam: coin
    async function openOfferCoin() {
      if (!tradeRoom || !tradeRoom.data) return;
      const d = tradeRoom.data;
      await refreshMe();
      const maxCoin = Math.min(d.limits.max_coin, Math.floor(currentUser.coin_balance) + d.my.coin);
      document.getElementById('modalBody').innerHTML = `
        <div class="modal-title">💰 Coin</div>
        <label class="send-label">Miqdor (0 - ${maxCoin})</label>
        <input type="number" class="send-input" id="trCoinInput" min="0" max="${maxCoin}" step="1" inputmode="numeric" value="${d.my.coin}">
        <div class="send-hint">Offerdagi coin Trade tugaguncha balansingizdan vaqtincha ushlab turiladi. Bekor bo'lsa qaytadi.</div>
        <button class="btn" style="margin-top:12px" id="trCoinSave">Saqlash</button>
        <button class="btn-back" onclick="openOfferPicker()">&larr; Orqaga</button>
      `;
      document.getElementById('trCoinSave').addEventListener('click', async () => {
        const raw = document.getElementById('trCoinInput').value.trim();
        if (!/^\d{1,7}$/.test(raw)) { showToast("Coin butun son bo'lishi kerak"); return; }
        const rr = await tradeAction('PUT', '/offer/coin', { amount: Number(raw) }, 'Coin saqlandi');
        if (rr && rr.ok) { await refreshMe(); closeModal(); }
      });
    }

    async function tradeAddGift(ugId) {
      const rr = await tradeAction('POST', '/offer/gift', { user_gift_id: ugId }, "Gift qo'shildi");
      if (rr && rr.ok) openOfferGiftList(); else if (rr) openOfferPicker();
    }

    function openTradeConfirm() {
      document.getElementById('modalBody').innerHTML = `
        <div class="modal-title">⚠️ Trade'ni yakunlashni tasdiqlaysizmi?</div>
        <div class="modal-sub">Trade yakunlangandan keyin gift va coinlar almashadi va amalni avtomatik ortga qaytarib bo'lmaydi.</div>
        <button class="btn good" id="trDoConfirm">Confirm Trade</button>
        <button class="btn secondary" style="margin-top:8px" onclick="closeModal()">Cancel</button>
      `;
      openModal();
      document.getElementById('trDoConfirm').addEventListener('click', async (e) => {
        const b = e.currentTarget;
        if (b.disabled) return;
        b.disabled = true;                      // double-click himoyasi (server ham idempotent)
        const rr = await tradeAction('POST', '/confirm', {}, null);
        closeModal();
        if (rr && rr.ok) {
          if (rr.data.status === 'COMPLETED') { showToast('🎉 Trade muvaffaqiyatli yakunlandi!'); refreshMe(); }
          else showToast('Tasdiqladingiz. Sherik tasdiqlashini kutamiz.');
        }
      });
    }

    async function tradeCancelActive() {
      if (!confirm("Trade'ni bekor qilasizmi? Gift va coinlar egalariga qaytariladi.")) return;
      const rr = await tradeAction('POST', '/cancel', {}, 'Trade bekor qilindi');
      if (rr && rr.ok) { refreshMe(); pollTrades(); }
    }

    async function loadShop() {

      }
      grid.innerHTML = gifts.map(g => `
        <div class="gift-card has-ribbon${g.sold_out ? ' sold-out' : ''}">

          ${giftImg(g)}
          <div class="gift-name">${g.name}</div>
          <div class="gift-qty">${g.quantity === null ? 'Cheksiz' : (g.sold_out ? 'Tugagan' : 'Qoldi: ' + g.quantity)}${(g.variants && g.variants.length) ? ' &middot; ' + (g.variants.length + 1) + ' tur' : ''}</div>
          <div class="gift-price"><img class="cn" src="icons/coin.png" alt="coin"> ${g.price}</div>
          <button class="btn" onclick="openGiftInfoModal(${g.id})">Ko'rish</button>
        </div>
      `).join('');
    }

    function openGiftInfoModal(giftId, variantId) {
      const g = lastLoadedShopGifts.find(x => x.id === giftId);
      if (!g) return;
      const maxQty = g.quantity === null ? 999 : g.quantity;

      // Asosiy gift ham bitta "tur" sifatida tanlanadi; admin qo'shgan turlar yoniga chiqadi
      const variants = g.variants || [];
      const sel = variantId ? variants.find(v => v.id === variantId) : null;
      const cur = sel
        ? { name: sel.name, price: sel.price, image_url: sel.image_url || g.image_url }
        : { name: g.name, price: g.price, image_url: g.image_url };
      const media = cur.image_url ? `<img src="${cur.image_url}">` : `<div class="bp-icon-fallback">🎁</div>`;
      const options = [{ id: null, name: g.name, price: g.price, image_url: g.image_url }, ...variants];
      const chips = variants.length ? `
        <div class="variant-row">
          ${options.map(o => `
            <button class="variant-chip ${(o.id || null) === (sel ? sel.id : null) ? 'active' : ''}" onclick="openGiftInfoModal(${g.id}, ${o.id === null ? 'null' : o.id})">
              ${(o.image_url || g.image_url) ? `<img src="${o.image_url || g.image_url}">` : `<div class="vc-fallback">🎁</div>`}
              <span class="vc-name">${o.name}</span>
              <span class="vc-price">${o.price}</span>
            </button>
          `).join('')}
        </div>` : '';
      window.__giftSel = { giftId: g.id, variantId: sel ? sel.id : null };

      document.getElementById('modalBody').innerHTML = `
        <div class="buy-pop">
          ${media}
          <div class="win-title">${cur.name}</div>
          ${g.event_ribbon && g.event_ribbon.name ? `<div class="modal-sub" style="font-weight:700;">🎉 ${esc(g.event_ribbon.name)}</div>` : ''}
          <div class="modal-sub"><img class="cn" src="icons/coin.png" alt="coin"> ${cur.price} &middot; ${g.quantity === null ? 'Cheksiz' : (g.sold_out ? 'Tugagan' : 'Qoldi: ' + g.quantity)}</div>
        </div>
        ${chips}
        ${g.sold_out ? `
        <button class="btn" style="margin-top:14px" disabled>Qolmagan</button>
        ` : `
        <div class="qty-row">
          <button class="qty-btn" onclick="changeGiftQty(-1, ${maxQty})">−</button>
          <div class="qty-value" id="giftQtyValue">1</div>

    function updateLiquidIndicator(tab) {
      const indicator = bottomNav?.querySelector('.nav-liquid-indicator');
      if (!indicator) return;
      const buttons = [...bottomNav.querySelectorAll('button[data-tab]')];
      const target = moreTabs.has(tab) ? moreNavButton : buttons.find(b => b.dataset.tab === tab) || buttons[0];
      if (!target) return;
      const navRect = bottomNav.getBoundingClientRect();
      const targetRect = target.getBoundingClientRect();
      const x = targetRect.left - navRect.left;
      const w = targetRect.width;
      const previousLeft = parseFloat(indicator.dataset.left || x);
      const distance = Math.abs(x - previousLeft);
      indicator.style.left = `${x}px`;
      indicator.style.width = `${w}px`;
      const stretch = Math.min(1.22, 1 + Math.min(distance / Math.max(w, 1), .22));
      indicator.style.transform = `translateX(0) scaleX(${stretch})`;
      indicator.style.borderRadius = '999px';
      clearTimeout(indicator._settleTimer);
      indicator._settleTimer = setTimeout(() => {
        indicator.style.transform = 'translateX(0) scaleX(1)';
      }, 430);
      indicator.dataset.left = x;
    }

      if (REDUCED_MOTION || MTP.animK() === 0) return;
      const mainEl = document.getElementById('main');
      if (!mainEl || !mainEl.firstElementChild) return;
      const r = mainEl.getBoundingClientRect();

      ghost.className = 'main-ghost ' + dir;
      ghost.style.cssText = `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;`;
      const inner = document.createElement('div');
      inner.className = 'main-ghost-inner';
      inner.style.padding = getComputedStyle(mainEl).padding;
      inner.style.transform = `translateY(${-mainEl.scrollTop}px)`;
      inner.innerHTML = mainEl.innerHTML;
      inner.querySelectorAll('[id]').forEach(e => e.removeAttribute('id'));
      inner.querySelectorAll('*').forEach(e => { e.style.animation = 'none'; });

      const from = TAB_ORDER[currentNavTab] ?? 0;

      const dir = to > from ? 'page-fwd' : (to < from ? 'page-back' : 'page-up');
      const mainEl = document.getElementById('main');
      if (tab !== currentNavTab) spawnMainGhost(dir);   // eski kontent chiqib ketadi
      const pending = _renderTab(tab);        // kontent shu zahoti almashadi
      mainEl.classList.remove('page-fwd', 'page-back', 'page-up');
      void mainEl.offsetWidth;                // animatsiyani qayta boshlash uchun
      mainEl.classList.add(dir);
      mainEl.scrollTo({ top: 0, behavior: 'smooth' });
      syncNavigation(tab);                    // pill darhol suriladi, kontent yuklanishini kutmaydi
      setMoreOpen(false);                     // Yana oynasi ochiq bo'lsa, yopiladi

    // Oynani tutqichdan pastga tortib yopish, fonni bosib yopish, Escape
    (function setupSheetGestures() {
      const ov = document.getElementById('modalOverlay');
      const zone = document.getElementById('modalGrab');
      const wrap = ov.querySelector('.modal-wrap');
      let startY = null, dy = 0, t0 = 0;
      zone.addEventListener('pointerdown', (e) => {
        if (ov.classList.contains('page')) return;
        startY = e.clientY; dy = 0; t0 = Date.now();
        wrap.style.transition = 'none';
        try { zone.setPointerCapture(e.pointerId); } catch (_) {}
      });
      zone.addEventListener('pointermove', (e) => {
        if (startY == null) return;
        dy = Math.max(0, e.clientY - startY);
        wrap.style.transform = `translateY(${dy}px)`;
      });
      const end = () => {
        if (startY == null) return;
        const fast = dy / Math.max(1, Date.now() - t0) > 0.6;   // px/ms
        startY = null;
        wrap.style.transition = 'transform 0.2s ease';
        if (dy > 90 || (dy > 30 && fast)) {
          wrap.style.transform = 'translateY(110%)';
          setTimeout(() => closeModal(true), 190);
        } else {
          wrap.style.transform = '';
          setTimeout(() => { wrap.style.transition = ''; }, 220);
        }
      };
      zone.addEventListener('pointerup', end);
      zone.addEventListener('pointercancel', end);
      ov.addEventListener('click', (e) => {
        if (e.target === ov && !ov.classList.contains('page')) closeModal();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape' || !ov.classList.contains('open')) return;
        if (ov.classList.contains('page')) pageBack(); else closeModal();
      });
    })();

    async function openCase(inventoryId, caseId) {
      await ensureCasesCache();
      const caseData = shopCasesCache[caseId];

      // Avval reel animatsiyasini ko'rsatamiz, keyin natijani serverdan olamiz
      document.getElementById('modalBody').innerHTML = `
        <div class="modal-title">Case ochilmoqda...</div>
        <div class="modal-sub">Omadingizni sinab ko'ring 🎲</div>
        <div class="reel-viewport">
          <div class="reel-marker"></div>
          <div class="reel-track" id="reelTrack"></div>
        </div>
      `;
      openModal();
      hap('open');

      const res = await fetch(`${API_BASE}/api/inventory/cases/${inventoryId}/open`, {
        method: 'POST', credentials: 'include',
      });
      const data = await res.json();
      if (!res.ok) {
        document.getElementById('modalBody').innerHTML = `<div class="modal-title">Xatolik</div><div class="modal-sub">${data.error || ''}</div>`;
        return;
      }

      // Reel uchun tasodifiy narsalar ro'yxati, oxirida yutgan narsa
      const pool = (caseData && caseData.items.length) ? caseData.items : [data.won.item_type === 'coin'
        ? { item_type: 'coin', coin_amount: data.won.coin_amount }
        : { item_type: 'gift', gift_name: data.won.name, gift_image_url: data.won.image_url }];

      const LANDING_INDEX = 26;
      const TOTAL_CELLS = 30;
      const cells = [];
      for (let i = 0; i < TOTAL_CELLS; i++) {
        if (i === LANDING_INDEX) {
          cells.push(data.won.item_type === 'coin'
            ? { item_type: 'coin', coin_amount: data.won.coin_amount }
            : { item_type: 'gift', gift_name: data.won.name, gift_image_url: data.won.image_url });
        } else {
          cells.push(pool[Math.floor(Math.random() * pool.length)]);
        }
      }

      const track = document.getElementById('reelTrack');
      track.innerHTML = cells.map(reelCellHTML).join('');

      const cellWidth = 100; // 90 + 2*5 margin
      const targetX = -(LANDING_INDEX * cellWidth + cellWidth / 2);
      track.style.transition = 'none';
      track.style.transform = 'translateX(0px)';
      // keyingi freymda animatsiyani boshlaymiz
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          track.style.transition = 'transform 2.6s cubic-bezier(.12,.85,.15,1)';
          track.style.transform = `translateX(${targetX}px)`;
        });
      });

      currentUser.coin_balance = data.coin_balance;
      updateCoinBadge();

      setTimeout(() => {
        const win = data.won;
        const body = document.getElementById('modalBody');
        if (!body) return;
        const winMedia = win.item_type === 'coin'
          ? `<div class="win-icon"><img class="cn" src="icons/coin.png" alt="coin"></div>`
          : (win.image_url ? `<img src="${win.image_url}">` : `<div class="win-icon">🎁</div>`);
        const winText = win.item_type === 'coin' ? `${win.coin_amount} coin` : win.name;
        hap('win');
        body.innerHTML = `
          <div class="win-reveal">
            ${winMedia}
            <div class="win-title">🎉 Siz yutdingiz!</div>
            <div class="modal-sub">${winText}</div>
            <button class="btn" onclick="closeModal(); loadInventoryCases(); loadInventory();">Ajoyib!</button>
          </div>
        `;
      }, 2900);
    }

    init();
  </script>
  <script src="airdrop.js"></script>
</body>
</html>
