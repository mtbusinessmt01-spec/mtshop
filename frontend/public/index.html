<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTshop — Liquid Glass</title>
<!-- MTshop Liquid Glass v2: 3-item navigation + elastic active glass indicator -->
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --accent: #6c5ce7;
    --accent-2: #a29bfe;
    --text: #f1f2f6;
    --muted: #8a8d98;
    --coin: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #app { display: none; flex-direction: column; height: 100vh; }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  header .brand { font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  header .logo-icon { width: 28px; height: 28px; border-radius: 8px; object-fit: cover; vertical-align: middle; }
  header .brand span { color: var(--accent-2); }
  .coin-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #1f232e;
    padding: 8px 14px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 14px;
  }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 18px 110px;
  }
  .page-title { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
  .page-sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .section-title { font-weight: 700; font-size: 15px; margin-bottom: 12px; }
  .type-tabs { display: flex; gap: 8px; }
  .type-tab {
    flex: 1; padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08);
    background: #1f232e; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .type-tab.active { background: linear-gradient(135deg, var(--accent), #5847c9); color: white; border-color: transparent; }
  .send-label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 6px; }
  .send-input {
    width: 100%; padding: 11px 12px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.08); background: #1f232e; color: var(--text); font-size: 14px;
  }
  .send-hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .msg { font-size: 13px; margin-top: 10px; }
  .msg.error { color: #ff6b6b; }
  .msg.success { color: #6bcB77; }
  .placeholder {
    background: var(--card);
    border-radius: 16px;
    padding: 32px 20px;
    text-align: center;
    color: var(--muted);
    border: 1px dashed rgba(255,255,255,0.1);
  }
  nav {
    position: fixed;
    bottom: calc(14px + env(safe-area-inset-bottom)); left: 14px; right: 14px;
    background: rgba(23,26,33,0.72);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    display: flex;
    justify-content: space-around;
    padding: 8px 4px;
  }
  nav button {
    background: none;
    border: none;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    padding: 6px 4px;
    cursor: pointer;
    flex: 1;
  }
  nav button .icon { font-size: 20px; }
  nav button.active { color: var(--accent-2); }
  #loadingScreen {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
  }
  .gift-card {
    background: var(--card);
    border-radius: 16px;
    padding: 14px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .gift-card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 12px;
    background: #1f232e;
    margin-bottom: 10px;
  }
  .gift-img-fallback {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 12px;
    background: #1f232e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin-bottom: 10px;
  }
  .gift-name { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
  .gift-qty { color: var(--muted); font-size: 11px; margin-bottom: 10px; }
  .gift-price { color: var(--coin); font-weight: 700; font-size: 13px; margin-bottom: 10px; }
  .btn {
    width: 100%;
    padding: 9px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #5847c9);
    color: white;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.secondary {
    background: #2a2f3d;
  }
  .empty-msg { color: var(--muted); text-align: center; padding: 40px 0; }
  .toast {
    position: fixed;
    top: calc(18px + env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%);
    background: rgba(35,38,47,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 999px;
    font-size: 13px;
    max-width: calc(100% - 32px);
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    z-index: 200;
    animation: toastIn 0.25s ease-out;
  }
  @keyframes toastIn {
    from { transform: translate(-50%, -12px); opacity: 0; }
    to { transform: translate(-50%, 0); opacity: 1; }
  }

  /* ---- Gift Trade ---- */
  .tr-card { background: var(--glass-bg, rgba(255,255,255,0.075)); border: 1px solid var(--glass-border, rgba(255,255,255,0.13)); border-radius: 18px; padding: 14px; margin-bottom: 14px; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: var(--glass-shadow, none); }
  .tr-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .tr-vs { color: var(--accent-2); font-weight: 700; font-size: 14px; margin-bottom: 14px; word-break: break-all; }
  .tr-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: rgba(162,155,254,0.18); color: var(--accent-2); white-space: nowrap; }
  .tr-badge.COMPLETED { background: rgba(107,203,119,0.18); color: #6bcb77; }
  .tr-badge.CANCELLED, .tr-badge.REJECTED, .tr-badge.FAILED, .tr-badge.EXPIRED { background: rgba(255,107,107,0.16); color: #ff8b8b; }
  .tr-chat { height: 190px; overflow-y: auto; background: rgba(0,0,0,0.22); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; -webkit-overflow-scrolling: touch; }
  .tr-msg { font-size: 13px; line-height: 1.35; word-break: break-word; overflow-wrap: anywhere; }
  .tr-msg b { color: var(--accent-2); }
  .tr-msg.me b { color: var(--coin); }
  .tr-msg-empty { color: var(--muted); font-size: 12px; text-align: center; margin: auto; }
  .tr-send { display: flex; gap: 8px; margin-top: 8px; }
  .tr-send .send-input { flex: 1; min-width: 0; }
  .tr-send .btn { width: auto; padding: 0 16px; }
  .tr-offer-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,0.05); margin-bottom: 6px; font-size: 13px; }
  .tr-offer-row img, .tr-offer-row .tr-gi { width: 34px; height: 34px; border-radius: 9px; object-fit: cover; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.06); }
  .tr-offer-row .tr-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tr-offer-row .tr-x { background: none; border: none; color: #ff8b8b; font-size: 16px; cursor: pointer; padding: 4px 8px; }
  .tr-offer-row.missing { opacity: .55; border: 1px dashed #ff8b8b; }
  .tr-empty { color: var(--muted); font-size: 12px; padding: 6px 2px 10px; }
  .tr-lock { font-size: 12px; font-weight: 700; margin-top: 8px; }
  .tr-lock.on { color: #6bcb77; }
  .tr-lock.off { color: var(--muted); }
  .tr-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .tr-btns .btn { flex: 1 1 140px; width: auto; padding: 11px; }
  .btn.danger { background: linear-gradient(135deg, #e25563, #b83245); }
  .btn.good { background: linear-gradient(135deg, #3fbf6a, #2a9150); }
  .tr-result { border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; font-size: 14px; font-weight: 700; text-align: center; }
  .tr-result.ok { background: rgba(107,203,119,0.15); color: #6bcb77; }
  .tr-result.bad { background: rgba(255,107,107,0.14); color: #ff8b8b; }
  .tr-hist { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 14px; background: rgba(255,255,255,0.05); margin-bottom: 8px; cursor: pointer; font-size: 13px; }
  .tr-hist:active { transform: scale(.985); }
  .tr-hist .tr-h-main { flex: 1; min-width: 0; }
  .tr-hist .tr-h-sub { color: var(--muted); font-size: 11px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tradeBanner { position: fixed; left: 12px; right: 12px; top: calc(64px + env(safe-area-inset-top)); z-index: 70; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  #tradeBanner .tb { pointer-events: auto; background: rgba(30,33,44,0.88); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1px solid rgba(162,155,254,0.35); border-radius: 16px; padding: 11px 13px; box-shadow: 0 12px 30px rgba(0,0,0,0.45); animation: tbIn 360ms cubic-bezier(.22,1,.36,1) both; }
  #tradeBanner .tb-t { font-size: 13px; font-weight: 700; word-break: break-word; }
  #tradeBanner .tb-s { font-size: 11px; color: var(--muted); margin-top: 2px; }
  #tradeBanner .tb-b { display: flex; gap: 8px; margin-top: 9px; }
  #tradeBanner .tb-b .btn { padding: 9px; }
  @keyframes tbIn { from { opacity: 0; transform: translateY(-10px) scale(.97); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { #tradeBanner .tb { animation: none; } }
  @media (max-width: 420px) { .tr-chat { height: 170px; } .tr-btns .btn { flex-basis: 100%; } }
  /* ---- Versiya yuklab olish (Profils) ---- */
  .ver-bar { height: 10px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; margin: 14px 0 8px; }
  .ver-bar > div { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .ver-tag { font-size: 10px; padding: 2px 8px; border-radius: 999px; margin-left: 6px; background: rgba(255,209,102,0.18); color: var(--coin); vertical-align: middle; }
  .admin-link {
    display: block;
    width: 100%;
    text-align: center;
    padding: 12px;
    margin-top: 20px;
    border-radius: 12px;
    background: #2a2f3d;
    color: var(--accent-2);
    text-decoration: none;
    font-weight: 600;
  }

  /* ---- Modal ---- */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(2px);
    display: none;
    align-items: flex-end;
    justify-content: center;
    padding: 14px;
    z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal-wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
    margin-bottom: calc(14px + env(safe-area-inset-bottom));
  }
  .modal-box {
    background: rgba(23,26,33,0.85);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    width: 100%;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    padding: 22px 20px;
    max-height: 82vh;
    overflow-y: auto;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    animation: slideUp 0.25s ease-out;
  }
  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .modal-sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .modal-close {
    position: absolute; top: -14px; right: -6px;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    background: #f1f2f6; border: none; border-radius: 50%;
    color: #171a21; font-size: 16px; font-weight: 700; cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.35);
  }
  .case-item-row {
    display: flex; align-items: center; gap: 12px;
    background: #1f232e; padding: 10px; border-radius: 12px; margin-bottom: 8px;
  }
  .case-item-row .ci-icon {
    width: 40px; height: 40px; border-radius: 10px; object-fit: cover;
    background: #2a2f3d; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink:0;
  }
  .case-item-row .ci-name { flex: 1; font-size: 13px; font-weight: 600; }
  .case-item-row .ci-chance { font-weight: 700; color: var(--accent-2); font-size: 13px; }

  /* ---- Reel (case ochish animatsiyasi) ---- */
  .reel-viewport {
    position: relative;
    width: 100%;
    height: 100px;
    overflow: hidden;
    background: #1f232e;
    border-radius: 14px;
    margin: 16px 0;
  }
  .reel-marker {
    position: absolute; top: 0; bottom: 0; left: 50%;
    width: 2px; background: var(--accent-2); z-index: 5;
    box-shadow: 0 0 8px var(--accent-2);
  }
  .reel-track {
    display: flex; align-items: center; height: 100%;
    position: absolute; left: 50%; top: 0;
  }
  .reel-cell {
    width: 90px; height: 84px; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    margin: 0 5px;
    background: #2a2f3d; border-radius: 12px;
    font-size: 26px;
  }
  .reel-cell img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
  .reel-cell .rc-label { font-size: 10px; color: var(--muted); margin-top: 4px; max-width: 80px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .win-reveal {
    text-align: center; padding: 10px 0;
    animation: popIn 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  .win-reveal img { width: 90px; height: 90px; border-radius: 16px; object-fit: cover; margin-bottom: 10px; box-shadow: 0 0 30px rgba(108,92,231,0.6); }
  .win-reveal .win-icon { font-size: 60px; margin-bottom: 10px; }
  .win-reveal .win-title { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  @keyframes popIn {
    0% { transform: scale(0.3); opacity: 0; }
    60% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); }
  }
  .buy-pop {
    text-align: center; padding: 10px 0;
    animation: popIn 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  .buy-pop img, .buy-pop .bp-icon-fallback {
    width: 100px; height: 100px; border-radius: 18px; object-fit: cover; margin: 0 auto 14px;
    box-shadow: 0 0 30px rgba(108,92,231,0.5);
  }
  .bp-icon-fallback { display: flex; align-items: center; justify-content: center; font-size: 44px; background: #2a2f3d; }
  .receipt {
    background: #1f232e; border-radius: 12px; padding: 14px; margin-top: 10px;
    border: 1px dashed rgba(255,255,255,0.15);
  }
  .receipt-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; }
  .receipt-row span:first-child { color: var(--muted); }
  .receipt-row span:last-child { font-weight: 700; }
  .btn-back {
    display: block; width: 100%; margin-top: 10px; padding: 10px; border: none; border-radius: 10px;
    background: #1f232e; color: var(--muted); font-size: 13px; cursor: pointer;
  }
  .qty-row { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 14px; }
  .qty-btn {
    width: 40px; height: 40px; border-radius: 12px; border: none;
    background: #1f232e; color: var(--text); font-size: 20px; font-weight: 700; cursor: pointer;
  }
  .qty-btn:active { background: var(--accent); }
  .qty-value { font-size: 20px; font-weight: 800; min-width: 30px; text-align: center; }

  /* ---------- Event banner va wallpaper ---------- */
  #eventWallpaper {
    position: fixed; inset: 0; z-index: -1; display: none;
    background-size: cover; background-position: center; background-repeat: no-repeat;
  }
  body.event-live { background: transparent; }
  body.event-live #eventWallpaper { display: block; }
  .event-banner {
    position: relative; border-radius: 18px; overflow: hidden; margin-bottom: 20px;
    background: linear-gradient(135deg, var(--accent), #5847c9);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .event-banner img { display: block; width: 100%; aspect-ratio: 3 / 1; object-fit: cover; }
  .event-banner .eb-noimg { aspect-ratio: 3 / 1; display: flex; align-items: center; justify-content: center; font-size: 34px; }
  .event-banner .eb-info {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 14px 10px;
    background: linear-gradient(transparent, rgba(0,0,0,0.78));
    display: flex; align-items: flex-end; justify-content: space-between; gap: 10px;
  }
  .event-banner .eb-name { font-weight: 800; font-size: 15px; }
  .event-banner .eb-label { font-size: 11px; color: rgba(255,255,255,0.75); text-align: right; }
  .event-banner .eb-time { font-weight: 800; font-size: 14px; color: var(--coin); text-align: right; white-space: nowrap; }
  .event-live-badge {
    position: absolute; top: 10px; left: 10px; background: #ff4d6d; color: #fff;
    font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px;
  }
  .guar-btn-row { display: flex; gap: 10px; margin-top: 14px; }
  .guar-btn-row .btn { flex: 1; }

  /* --- Liquid Glass navigation redesign --- */
  :root {
    --glass-bg: rgba(255,255,255,0.075);
    --glass-border: rgba(255,255,255,0.13);
    --glass-highlight: rgba(255,255,255,0.16);
    --glass-shadow: 0 18px 45px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  body::before {
    content: "";
    position: fixed;
    inset: -25%;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(circle at 18% 18%, rgba(108,92,231,.16), transparent 28%),
      radial-gradient(circle at 82% 72%, rgba(162,155,254,.10), transparent 30%),
      radial-gradient(circle at 50% 100%, rgba(77,120,255,.08), transparent 28%);
    filter: blur(30px);
    animation: ambientFloat 12s ease-in-out infinite alternate;
  }
  @keyframes ambientFloat {
    from { transform: translate3d(-1%, -1%, 0) scale(1); }
    to { transform: translate3d(1%, 1%, 0) scale(1.04); }
  }
  nav#bottomNav {
    position: fixed;
    bottom: calc(14px + env(safe-area-inset-bottom));
    left: 50%;
    right: auto;
    width: min(430px, calc(100vw - 28px));
    transform: translateX(-50%);
    height: 68px;
    padding: 5px;
    gap: 4px;
    justify-content: stretch;
    align-items: stretch;
    overflow: hidden;
    background: linear-gradient(135deg, rgba(36,39,50,.72), rgba(18,20,27,.62));
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    box-shadow: var(--glass-shadow);
    isolation: isolate;
    z-index: 60; /* Yana oynasi ochilganda ham menyu xira bo'lib qolmasin */
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(26px) saturate(180%);
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    animation: navRise 600ms cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes navRise {
    from { transform: translate(-50%, 24px); opacity: 0; }
    to { transform: translate(-50%, 0); opacity: 1; }
  }
  nav#bottomNav::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(120deg, rgba(255,255,255,.10), transparent 35%, rgba(255,255,255,.035));
    z-index: -1;
  }
  nav#bottomNav .nav-liquid-indicator {
    position: absolute;
    top: 5px;
    left: 5px;
    width: calc((100% - 10px - 8px) / 3);
    height: calc(100% - 10px);
    border-radius: 999px;
    background:
      radial-gradient(circle at 28% 18%, rgba(255,255,255,.25), transparent 32%),
      linear-gradient(135deg, rgba(255,255,255,.22), rgba(255,255,255,.065));
    border: 1px solid rgba(255,255,255,.17);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.18),
      inset 0 -1px 2px rgba(0,0,0,.10),
      0 5px 20px rgba(0,0,0,.16);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    transform: translateX(0) scaleX(1);
    transform-origin: center;
    transition:
      left 560ms cubic-bezier(.16,1,.3,1),
      width 560ms cubic-bezier(.16,1,.3,1),
      transform 560ms cubic-bezier(.16,1,.3,1),
      border-radius 560ms cubic-bezier(.16,1,.3,1);
    will-change: transform, left, width;
    z-index: 0;
  }
  nav#bottomNav .nav-liquid-indicator::before {
    content: "";
    position: absolute;
    inset: 1px;
    border-radius: inherit;
    background: linear-gradient(90deg, rgba(255,255,255,.08), transparent 45%, rgba(255,255,255,.08));
    filter: blur(5px);
  }
  nav#bottomNav .nav-liquid-indicator::after {
    content: "";
    position: absolute;
    width: 42%;
    height: 120%;
    left: -18%;
    top: -10%;
    border-radius: 999px;
    background: rgba(255,255,255,.10);
    filter: blur(10px);
    transform: rotate(14deg);
    animation: liquidSheen 3.8s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes liquidSheen {
    0%, 28% { left: -24%; opacity: .15; }
    55%, 75% { left: 72%; opacity: .07; }
    100% { left: 112%; opacity: 0; }
  }
  nav#bottomNav button {
    position: relative;
    z-index: 1;
    height: 100%;
    min-width: 0;
    padding: 6px 5px;
    border-radius: 999px;
    color: rgba(255,255,255,.58);
    transition: color 260ms ease, transform 180ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  nav#bottomNav button:hover { color: rgba(255,255,255,.9); }
  nav#bottomNav button:active { transform: scale(.94); }
  nav#bottomNav button.active { color: #fff; }
  nav#bottomNav.sheet-open button[data-tab].active { color: rgba(255,255,255,.58); }
  nav#bottomNav button .icon { font-size: 20px; line-height: 1; height: 24px; width: 24px; margin: 0 auto 2px; display: grid; place-items: center; }
  nav#bottomNav button.active .icon { animation: iconPop 520ms cubic-bezier(.34,1.56,.64,1); }
  @keyframes iconPop {
    0% { transform: scale(.78) translateY(3px); }
    55% { transform: scale(1.18) translateY(-2px); }
    100% { transform: scale(1) translateY(0); }
  }
  nav#bottomNav .dots-icon { width: 22px; height: 22px; display: block; }
  nav#bottomNav .dots-icon circle { fill: currentColor; transition: transform 320ms cubic-bezier(.34,1.56,.64,1); transform-box: fill-box; transform-origin: center; }
  nav#bottomNav button#moreNavButton[aria-expanded="true"] .dots-icon circle:nth-child(1) { transform: translateX(-1.5px) scale(1.15); }
  nav#bottomNav button#moreNavButton[aria-expanded="true"] .dots-icon circle:nth-child(3) { transform: translateX(1.5px) scale(1.15); }
  nav#bottomNav button span:last-child { font-size: 11px; font-weight: 650; letter-spacing: .1px; }

  .more-backdrop {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: rgba(0,0,0,.36);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 300ms ease;
  }
  .more-backdrop.open { opacity: 1; pointer-events: auto; }
  .more-sheet {
    position: fixed;
    z-index: 50;
    left: 50%;
    bottom: calc(94px + env(safe-area-inset-bottom));
    width: min(430px, calc(100vw - 28px));
    transform: translate(-50%, 22px) scale(.97);
    transform-origin: bottom center;
    opacity: 0;
    pointer-events: none;
    padding: 10px 14px 14px;
    border: 1px solid var(--glass-border);
    border-radius: 27px;
    background: linear-gradient(145deg, rgba(38,41,52,.86), rgba(17,19,26,.82));
    box-shadow: 0 22px 70px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.10);
    backdrop-filter: blur(30px) saturate(155%);
    -webkit-backdrop-filter: blur(30px) saturate(155%);
    transition: transform 360ms cubic-bezier(.22,1,.36,1), opacity 240ms ease;
  }
  .more-sheet.open { transform: translate(-50%, 0) scale(1); opacity: 1; pointer-events: auto; }
  .sheet-handle { width: 38px; height: 4px; border-radius: 99px; background: rgba(255,255,255,.25); margin: 1px auto 12px; }
  .sheet-header { display: flex; align-items: center; justify-content: space-between; padding: 2px 2px 13px; }
  .sheet-title { font-size: 18px; font-weight: 800; }
  .sheet-subtitle { margin-top: 3px; color: var(--muted); font-size: 12px; }
  .sheet-close { width: 32px; height: 32px; border: 1px solid rgba(255,255,255,.08); border-radius: 50%; background: rgba(255,255,255,.07); color: #fff; cursor: pointer; }
  .more-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .more-item {
    display: flex; align-items: center; gap: 10px; text-align: left; min-height: 66px; padding: 11px;
    border: 1px solid rgba(255,255,255,.08); border-radius: 17px; color: #fff; cursor: pointer;
    background: rgba(255,255,255,.055); box-shadow: inset 0 1px 0 rgba(255,255,255,.045);
    transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
  }
  .more-item:hover { transform: translateY(-2px); background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.14); }
  .more-item:active { transform: scale(.97); }
  .more-icon { width: 38px; height: 38px; display: grid; place-items: center; flex: 0 0 38px; border-radius: 13px; background: rgba(255,255,255,.09); font-size: 20px; }
  .more-item b { display: block; font-size: 13px; }
  .more-item small { display: block; color: var(--muted); font-size: 10px; line-height: 1.25; margin-top: 3px; }
  @media (max-width: 360px) {
    .more-grid { grid-template-columns: 1fr; }
    .more-item { min-height: 58px; }
  }


  /* --- Sahifalar orasida o'tish animatsiyalari --- */
  #main.page-fwd > * { animation: pageInFwd 460ms cubic-bezier(.22,1,.36,1) both; }
  #main.page-back > * { animation: pageInBack 460ms cubic-bezier(.22,1,.36,1) both; }
  #main.page-up > * { animation: pageInUp 460ms cubic-bezier(.22,1,.36,1) both; }
  #main.page-fwd > *:nth-child(2), #main.page-back > *:nth-child(2), #main.page-up > *:nth-child(2) { animation-delay: 40ms; }
  #main.page-fwd > *:nth-child(3), #main.page-back > *:nth-child(3), #main.page-up > *:nth-child(3) { animation-delay: 80ms; }
  #main.page-fwd > *:nth-child(4), #main.page-back > *:nth-child(4), #main.page-up > *:nth-child(4) { animation-delay: 120ms; }
  #main.page-fwd > *:nth-child(n+5), #main.page-back > *:nth-child(n+5), #main.page-up > *:nth-child(n+5) { animation-delay: 160ms; }
  @keyframes pageInFwd { from { opacity: 0; transform: translateX(34px) scale(.985); filter: blur(5px); } to { opacity: 1; transform: none; filter: blur(0); } }
  @keyframes pageInBack { from { opacity: 0; transform: translateX(-34px) scale(.985); filter: blur(5px); } to { opacity: 1; transform: none; filter: blur(0); } }
  @keyframes pageInUp { from { opacity: 0; transform: translateY(26px) scale(.985); filter: blur(5px); } to { opacity: 1; transform: none; filter: blur(0); } }

  /* Kartalar ketma-ket chiqadi */
  .grid > .gift-card { animation: cardIn 420ms cubic-bezier(.22,1,.36,1) both; }
  .grid > .gift-card:nth-child(2) { animation-delay: 45ms; }
  .grid > .gift-card:nth-child(3) { animation-delay: 90ms; }
  .grid > .gift-card:nth-child(4) { animation-delay: 135ms; }
  .grid > .gift-card:nth-child(n+5) { animation-delay: 180ms; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(16px) scale(.96); } to { opacity: 1; transform: none; } }

  /* "Yana" oynasidagi tugmalar ketma-ket chiqadi */
  .more-sheet.open .more-item { animation: sheetItemIn 420ms cubic-bezier(.34,1.3,.64,1) both; }
  .more-sheet.open .more-item:nth-child(1) { animation-delay: 70ms; }
  .more-sheet.open .more-item:nth-child(2) { animation-delay: 120ms; }
  .more-sheet.open .more-item:nth-child(3) { animation-delay: 170ms; }
  .more-sheet.open .more-item:nth-child(4) { animation-delay: 220ms; }
  .more-sheet.open .more-item:nth-child(5) { animation-delay: 270ms; }
  @keyframes sheetItemIn { from { opacity: 0; transform: translateY(14px) scale(.94); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    #main > *, .grid > .gift-card, .more-sheet.open .more-item, nav#bottomNav, nav#bottomNav button.active .icon { animation: none !important; }
    nav#bottomNav .nav-liquid-indicator { transition-duration: 1ms !important; }
  }

</style>
</head>
<body>
  <div id="loadingScreen">Yuklanmoqda...</div>

  <div id="app">
    <header>
      <div class="brand"><img src="logo.jpg" alt="MTshop" class="logo-icon"> <span>MTshop</span></div>
      <div class="coin-badge">🪙 <span id="coinBalance">0</span></div>
    </header>

    <main id="main">
      <!-- tab content shu yerga chiqadi -->
    </main>

    <nav id="bottomNav" aria-label="Asosiy menyu">
      <div class="nav-liquid-indicator" aria-hidden="true"></div>
      <button data-tab="shops" class="active" aria-label="Shops"><span class="icon">🛍️</span><span>Shops</span></button>
      <button data-tab="inventor" aria-label="Inventor"><span class="icon">🎒</span><span>Inventor</span></button>
      <button id="moreNavButton" type="button" aria-haspopup="dialog" aria-expanded="false"><span class="icon"><svg class="dots-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg></span><span>Yana</span></button>
    </nav>

    <div class="more-backdrop" id="moreBackdrop"></div>
    <section class="more-sheet" id="moreSheet" role="dialog" aria-modal="true" aria-labelledby="moreSheetTitle" aria-hidden="true">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div>
          <div class="sheet-title" id="moreSheetTitle">Yana</div>
          <div class="sheet-subtitle">Qo‘shimcha bo‘limlar</div>
        </div>
        <button class="sheet-close" id="closeMoreButton" type="button" aria-label="Yopish">✕</button>
      </div>
      <div class="more-grid">
        <button class="more-item" data-tab="jonatmoq"><span class="more-icon">📤</span><span><b>Jo‘natmoq</b><small>Gift yoki case yuborish</small></span></button>
        <button class="more-item" data-tab="mypet"><span class="more-icon">🐾</span><span><b>MyPet</b><small>Petingizni boshqaring</small></span></button>
        <button class="more-item" data-tab="kreditlar"><span class="more-icon">💳</span><span><b>Kreditlar</b><small>Kredit va kafil so‘rovlari</small></span></button>
        <button class="more-item" data-tab="trade"><span class="more-icon">🔄</span><span><b>Trade</b><small>Do‘st bilan gift almashish</small></span></button>
        <button class="more-item" data-tab="profils"><span class="more-icon">👤</span><span><b>Profils</b><small>Profil va hisob</small></span></button>
      </div>
    </section>
  </div>

  <div id="eventWallpaper"></div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-wrap">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-box">
        <div id="modalBody"></div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    let currentUser = null;
    let actionInProgress = false; // tugmani ketma-ket tez-tez bosishning oldini olish uchun

    async function init() {
      try {
        const res = await fetch(`${API_BASE}/api/auth/me`, { credentials: 'include' });
        if (!res.ok) {
          window.location.href = 'login.html';
          return;
        }
        currentUser = await res.json();
        updateCoinBadge();
        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        const validTabs = ['shops', 'inventor', 'jonatmoq', 'mypet', 'kreditlar', 'trade', 'profils'];
        const startTab = validTabs.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'shops';
        renderTab(startTab);
        refreshEvent();
        setInterval(refreshEvent, 30000);
        // Kirganda bildirishnomalar ketma-ket chiqadi: kafillik so'rovi -> qarzdor to'lamadi -> kafildan yechildi -> kafil eslatmasi -> kelgan narsalar
        noticeSteps = [checkGuarantorRequests, checkGuarantorOverdues, checkGuarantorCharged, checkBorrowerReminders, checkIncomingTransfers];
        nextNotice();
        setInterval(pollGuarantorRequests, 30000);
        startTradePolling();
      } catch (e) {
        window.location.href = 'login.html';
      }
    }

    function updateCoinBadge() {
      document.getElementById('coinBalance').textContent = currentUser.coin_balance;
    }

    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2200);
    }

    function giftImg(g) {
      return g.image_url
        ? `<img src="${g.image_url}" alt="${g.name}">`
        : `<div class="gift-img-fallback">🎁</div>`;
    }

    async function renderTab(tab) {
      if (eventTicker) { clearInterval(eventTicker); eventTicker = null; }
      stopTradeRoom();
      tradeCurrentTab = tab;
      renderTradeBanner();
      document.querySelectorAll('nav button').forEach(b => {
        b.classList.toggle('active', b.dataset.tab === tab);
      });
      const main = document.getElementById('main');

      if (tab === 'shops') {
        main.innerHTML = `
          <div id="eventBanner"></div>
          <div class="page-title">Shops</div>
          <div class="page-sub">Giftlar va case'larni sotib oling.</div>
          <div class="section-title">🎁 Giftlar</div>
          <div id="shopGrid" class="grid"></div>
          <div class="section-title" style="margin-top:24px">📦 Case'lar</div>
          <div id="shopCaseGrid" class="grid"></div>
        `;
        renderEventBanner();
        loadShop();
        loadShopCases();
      } else if (tab === 'inventor') {
        main.innerHTML = `
          <div class="page-title">Inventor</div>
          <div class="page-sub">Sizning giftlaringiz va case'laringiz.</div>
          <div class="section-title">🎁 Giftlarim</div>
          <div id="invGrid" class="grid"></div>
          <div class="section-title" style="margin-top:24px">📦 Case'larim</div>
          <div id="invCaseGrid" class="grid"></div>
        `;
        loadInventory();
        loadInventoryCases();
      } else if (tab === 'jonatmoq') {
        renderJonatmoq(main);
      } else if (tab === 'kreditlar') {
        renderKreditlar(main);
      } else if (tab === 'mypet') {
        renderMyPet(main);
      } else if (tab === 'trade') {
        renderTradeHome(main);
      } else if (tab === 'profils') {
        renderProfil(main);
      }
    }

    const UZ_MONTHS = ['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
    function formatUzDate(isoStr) {
      const d = new Date(isoStr);
      return `${d.getDate()}-${UZ_MONTHS[d.getMonth()]} ${d.getFullYear()}-yil`;
    }

    let myCreditsCache = [];
    let creditTypesCache = [];

    async function renderKreditlar(main) {
      main.innerHTML = `
        <div class="page-title">Kreditlar</div>
        <div class="page-sub">Kredit oling yoki mavjud to'lovlaringizni ko'ring.</div>
        <div id="guarOverdueWrap"></div>
        <div id="guarIncomingWrap"></div>
        <div class="section-title">💳 Mening kreditlarim</div>
        <div id="myCreditsList"></div>
        <div id="myRequestsWrap"></div>
        <div class="section-title" style="margin-top:24px">🏦 Mavjud kredit turlari</div>
        <div id="creditTypesList"></div>
      `;
      refreshMe();
      loadGuarantorOverdueList();
      loadGuarantorIncomingList();
      loadMyRequests();
      loadMyCredits();
      loadCreditTypesForUser();
    }

    async function loadMyCredits() {
      const el = document.getElementById('myCreditsList');
      el.innerHTML = '<div class="empty-msg">Yuklanmoqda...</div>';
      const res = await fetch(`${API_BASE}/api/credits/my`, { credentials: 'include' });
      const list = await res.json();
      myCreditsCache = list;
      const active = list.filter(c => c.status !== 'paid');
      if (!active.length) {
        el.innerHTML = '<div class="empty-msg">Faol kreditingiz yo\'q</div>';
        return;
      }
      el.innerHTML = active.map(c => `
        <div class="gift-card" style="text-align:left; padding:16px; margin-bottom:10px;">
          <div style="font-weight:700; margin-bottom:6px;">${c.type_name}</div>
          <div style="font-size:13px; color:var(--muted); margin-bottom:10px;">Qolgan qarz: 🪙 ${c.remaining_amount}</div>
          <button class="btn" onclick="openCreditDetail(${c.id})">Ko'rish</button>
        </div>
      `).join('');
    }

    function openCreditDetail(creditId) {
      const c = myCreditsCache.find(x => x.id === creditId);
      if (!c) return;
      const statusBadge = c.status === 'defaulted' ? `<div style="color:#ff6b6b;font-weight:700;margin-bottom:10px;">⛔ BLOKLANGAN</div>` : '';
      const paymentsHtml = c.payments.length
        ? c.payments.map(p => `
            <div class="case-item-row">
              <div class="ci-icon">${p.payment_type === 'early' ? '⚡' : '📅'}</div>
              <div class="ci-name">🪙 ${p.amount} ${p.payment_type === 'early' ? '(oldindan)' : '(jadval)'}</div>
              <div class="ci-chance" style="font-size:11px;">${formatUzDate(p.created_at)}</div>
            </div>`).join('')
        : `<div class="modal-sub">Hali to'lov qilinmagan</div>`;

      document.getElementById('modalBody').innerHTML = `
        <div class="modal-title">${c.type_name}</div>
        ${statusBadge}
        <div class="case-item-row"><div class="ci-name">Siz olgan summa</div><div class="ci-chance">🪙 ${c.principal_amount}</div></div>
        <div class="case-item-row"><div class="ci-name">Siz qaytaradigan summa</div><div class="ci-chance">🪙 ${c.total_to_pay}</div></div>
        <div class="case-item-row"><div class="ci-name">Kredit foizi</div><div class="ci-chance">${c.interest_percent}%</div></div>
        <div class="case-item-row"><div class="ci-name">Qolgan qarz</div><div class="ci-chance">🪙 ${c.remaining_amount}</div></div>
        <div class="case-item-row"><div class="ci-name">Keyingi to'lov</div><div class="ci-chance" style="font-size:12px;">${formatUzDate(c.next_payment_at)}</div></div>

        <div class="modal-sub" style="margin-top:16px">Oxirgi to'lovlarim</div>
        ${paymentsHtml}

        ${c.status === 'active' ? `<button class="btn" style="margin-top:14px" onclick="openPayChoice(${c.id})">To'lash</button>` : ''}
      `;
      openModal();
    }

    function openPayChoice(creditId) {
      const c = myCreditsCache.find(x => x.id === creditId);
      document.getElementById('modalBody').innerHTML = `
        <div class="modal-title">To'lov usulini tanlang</div>
        <div class="modal-sub">"${c.type_name}" uchun</div>
        <div class="gift-card" style="text-align:left; padding:14px; margin-bottom:10px;">
          <div style="font-weight:700; margin-bottom:4px;">📅 Jadval bo'yicha</div>
          <div style="font-size:13px; color:var(--muted); margin-bottom:10px;">Haftalik belgilangan to'lov: 🪙 ${Math.min(c.weekly_payment, c.remaining_amount)}</div>
          <button class="btn" onclick="payScheduled(${c.id})">Shu summani to'lash</button>
        </div>
        <div class="gift-card" style="text-align:left; padding:14px;">
          <div style="font-weight:700; margin-bottom:4px;">⚡ Oldindan to'lov</div>
          <div style="font-size:13px; color:var(--muted); margin-bottom:10px;">O'zingiz xohlagan summani to'lang (qolgan qarz: 🪙 ${c.remaining_amount})</div>
          <input type="number" class="send-input" id="earlyPayAmount" placeholder="Miqdor" min="0" max="${c.remaining_amount}" step="0.01" style="margin-bottom:10px;">
          <button class="btn" onclick="payEarly(${c.id})">To'lash</button>
        </div>
        <button class="btn-back" onclick="openCreditDetail(${c.id})">&larr; Orqaga</button>
      `;
    }

    async function payScheduled(creditId) {
      await doPay(creditId, { mode: 'scheduled' });
    }

    async function payEarly(creditId) {
      const amount = parseFloat(document.getElementById('earlyPayAmount').value);
      if (!amount || amount <= 0) { showToast("Miqdorni to'g'ri kiriting"); return; }
      await doPay(creditId, { mode: 'early', amount });
    }

    async function doPay(creditId, body) {
      const res = await fetch(`${API_BASE}/api/credits/${creditId}/pay`, {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) { showToast(data.error || 'Xatolik'); return; }
      currentUser.coin_balance = data.coin_balance;
      updateCoinBadge();
      showReceipt(data);
      loadMyCredits();
    }

    function showReceipt(data) {
      const now = new Date();
      document.getElementById('modalBody').innerHTML = `
        <div class="win-reveal">
          <div class="win-icon">✅</div>
          <div class="win-title">To'lov tasdiqlandi</div>
          <div class="receipt">
            <div class="receipt-row"><span>To'langan summa</span><span>🪙 ${data.paid_amount}</span></div>
            <div class="receipt-row"><span>Qolgan qarz</span><span>🪙 ${data.remaining_amount}</span></div>
            <div class="receipt-row"><span>Holat</span><span>${data.status === 'paid' ? "To'liq yopildi 🎉" : 'Faol'}</span></div>
            <div class="receipt-row"><span>Sana</span><span>${formatUzDate(now.toISOString())}</span></div>
          </div>
          <button class="btn" style="margin-top:14px" onclick="closeModal(); loadMyCredits();">Yopish</button>
        </div>
      `;
    }

    async function loadCreditTypesForUser() {
      const el = document.getElementById('creditTypesList');
      el.innerHTML = '<div class="empty-msg">Yuklanmoqda...</div>';
      const res = await fetch(`${API_BASE}/api/credits/types`, { credentials: 'include' });
      const types = await res.json();
      creditTypesCache = types;
      if (!types.length) {
        el.innerHTML = '<div class="empty-msg">Hozircha kredit turlari yo\'q</div>';
        return;
      }
      el.innerHTML = types.map(t => `
        <div class="gift-card" style="text-align:left; padding:16px; margin-bottom:10px;">

    async function submitTakeCredit(typeId) {
      if (actionInProgress) return;
      const msg = document.getElementById('takeCreditMsg');
      msg.textContent = ''; msg.className = 'msg';
      const amount = parseFloat(document.getElementById('takeCreditAmt').value);
      const guarantor = document.getElementById('takeCreditGuarantor').value.trim();
      if (!amount) { msg.textContent = "Miqdorni kiriting"; msg.classList.add('error'); return; }
      if (!guarantor) { msg.textContent = "Kafil username kiriting"; msg.classList.add('error'); return; }

      actionInProgress = true;
      try {
        const res = await fetch(`${API_BASE}/api/credits/take`, {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credit_type_id: typeId, amount, guarantor_username: guarantor }),
        });
        const data = await res.json();
        if (!res.ok) { msg.textContent = data.error || 'Xatolik'; msg.classList.add('error'); return; }

        closeModal();
        showToast(`So'rov @${data.guarantor_username} ga yuborildi. Kafil tasdiqlasa kredit beriladi 🤝`);
        loadMyRequests();
        loadCreditTypesForUser();
      } finally {
        actionInProgress = false;
      }
    }

    // ---------- Kafil (kafolat) tizimi ----------

    function esc(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function refreshMe() {
      try {
        const res = await fetch(`${API_BASE}/api/auth/me`, { credentials: 'include' });
        if (res.ok) { currentUser = await res.json(); updateCoinBadge(); }
      } catch (e) {}
    }

    const guarantorShown = new Set();

    async function fetchIncomingGuarantor() {
      try {
        const res = await fetch(`${API_BASE}/api/credits/requests/incoming`, { credentials: 'include' });
        if (!res.ok) return [];
        return await res.json();
      } catch (e) { return []; }
    }

    // Sayt ochilganda: kafillik so'rovlari bo'lsa darhol oyna chiqadi. true qaytaradi, agar oyna ko'rsatilgan bo'lsa.
    async function checkGuarantorRequests() {
      const list = await fetchIncomingGuarantor();
      if (!list.length) return false;
      list.forEach(r => guarantorShown.add(r.id));
      showGuarantorModal(list, 0);
      return true;
    }

    // ---------- Bildirishnomalar zanjiri (kirganda ketma-ket chiqadi) ----------

    let noticeSteps = [];
    async function nextNotice() {
      while (noticeSteps.length) {
        const step = noticeSteps.shift();
        let shown = false;
        try { shown = await step(); } catch (e) { shown = false; }
        if (shown) return; // oyna yopilganda yana nextNotice() chaqiriladi
      }
    }

    // Sayt ochiq turganda yangi hodisa kelsa ham oyna chiqadi (har hodisa faqat bir marta avtomatik chiqadi)
    const overdueShown = new Set();
    const chargedShown = new Set();
    const reminderShown = new Set();

    async function pollGuarantorRequests() {
      if (document.getElementById('modalOverlay').classList.contains('open')) return;

      const list = await fetchIncomingGuarantor();
      const fresh = list.filter(r => !guarantorShown.has(r.id));
      if (fresh.length) {
        fresh.forEach(r => guarantorShown.add(r.id));
        showGuarantorModal(fresh, 0);
        return;
      }

      const od = await fetchGuarantorOverdues();
      const freshOd = od.waiting.filter(o => !o.reminded_at && !overdueShown.has(o.id));
      if (freshOd.length) {
        freshOd.forEach(o => overdueShown.add(o.id));
        showOverdueModal(freshOd, 0, od.server_now);
        return;
      }
      const freshCh = od.charged.filter(c => !chargedShown.has(c.id));
      if (freshCh.length) {
        freshCh.forEach(c => chargedShown.add(c.id));
        showChargedModal(freshCh);
        return;
      }

      const rem = await fetchBorrowerReminders();
      const freshRem = rem.filter(r => !reminderShown.has(r.id + ':' + r.reminded_at));
      if (freshRem.length) {
        freshRem.forEach(r => reminderShown.add(r.id + ':' + r.reminded_at));
        showReminderModal(freshRem);
      }
    }

    // ---------- Kafil javobgarligi: qarzdor to'lamasa ----------

    async function fetchGuarantorOverdues() {
      const empty = { waiting: [], charged: [], server_now: Date.now() };
      try {
        const res = await fetch(`${API_BASE}/api/credits/guarantor/overdues`, { credentials: 'include' });
        if (!res.ok) return empty;
        return await res.json();
      } catch (e) { return empty; }
    }

    async function fetchBorrowerReminders() {
      try {
        const res = await fetch(`${API_BASE}/api/credits/borrower/reminders`, { credentials: 'include' });
        if (!res.ok) return [];
        return await res.json();
      } catch (e) { return []; }
    }

    function timeLeftText(deadlineIso, serverNow) {
      const ms = new Date(deadlineIso).getTime() - serverNow;
      if (ms <= 0) return 'muddat tugadi';
      const h = Math.floor(ms / 3600000);
      const m = Math.floor((ms % 3600000) / 60000);
      return h >= 1 ? `${h} soat ${m} daqiqa` : `${Math.max(1, m)} daqiqa`;
    }

    // Kirganda: hali eslatilmagan (kafil harakat qilishi kerak bo'lgan) holatlar
    async function checkGuarantorOverdues() {
      const od = await fetchGuarantorOverdues();
      const list = od.waiting.filter(o => !o.reminded_at);
      if (!list.length) return false;
      list.forEach(o => overdueShown.add(o.id));
      showOverdueModal(list, 0, od.server_now);
      return true;
    }

          <div class="receipt">
            <div class="receipt-row"><span>Qarzdor</span><span>@${esc(o.borrower_username)}</span></div>

    function advanceOverdue(index) {
      const list = window.__overdueList || [];

    async function sendBorrowerReminder(id) {

    // ---------- Event: banner, hisoblagich va sayt foni ----------

    let eventState = { event: null, offset: 0, loaded: false };
    let eventTicker = null;
    let lastEventRefresh = 0;

    function fmtCountdown(ms) {
      const s = Math.max(0, Math.floor(ms / 1000));
      const days = Math.floor(s / 86400);
      if (days >= 1) return `${days} Day`;
      const hours = Math.floor(s / 3600);
      if (hours >= 1) return `${hours} hour`;
      return `${Math.floor(s / 60)} minute and ${s % 60} second`;
    }

    function eventNow() { return Date.now() + eventState.offset; }

    function applyEventTheme() {
      const ev = eventState.event;
      const wp = document.getElementById('eventWallpaper');
      if (ev && ev.status === 'live' && ev.wallpaper_url) {
        wp.style.backgroundImage = `linear-gradient(rgba(15,17,21,0.55), rgba(15,17,21,0.55)), url("${ev.wallpaper_url}")`;
        document.body.classList.add('event-live');
      } else {
        document.body.classList.remove('event-live');
        wp.style.backgroundImage = '';
      }
    }

    async function refreshEvent() {
      lastEventRefresh = Date.now();
      try {
        const res = await fetch(`${API_BASE}/api/events/current`, { credentials: 'include' });
        if (!res.ok) return;
        const data = await res.json();
        const prev = eventState;
        eventState = { event: data.event, offset: data.server_now - Date.now(), loaded: true };
        applyEventTheme();
        renderEventBanner();

        // Event holati o'zgarsa (boshlandi / tugadi) Shop yangilanadi — yangi gift/case'lar paydo bo'ladi
        const a = prev.event, b = data.event;
        const changed = prev.loaded && ((a && a.id) !== (b && b.id) || (a && b && a.status !== b.status));
        if (changed && document.getElementById('shopGrid')) { loadShop(); loadShopCases(); }
      } catch (e) {}
    }

    function renderEventBanner() {
      const box = document.getElementById('eventBanner');
      if (eventTicker) { clearInterval(eventTicker); eventTicker = null; }
      if (!box) return;
      const ev = eventState.event;
      if (!ev) { box.innerHTML = ''; return; }

      const live = ev.status === 'live';
      box.innerHTML = `
        <div class="event-banner">
          ${ev.banner_url ? `<img src="${ev.banner_url}" alt="">` : `<div class="eb-noimg">🎉</div>`}
          ${live ? `<div class="event-live-badge">● LIVE</div>` : ''}
          <div class="eb-info">
            <div class="eb-name">${esc(ev.name)}</div>
            <div>
              <div class="eb-label">${live ? 'Tugashiga' : 'Boshlanishiga'}</div>
              <div class="eb-time" id="ebTime"></div>
            </div>
          </div>
        </div>
      `;

      const target = new Date(live ? ev.ends_at : ev.starts_at).getTime();
      const tick = () => {
        const el = document.getElementById('ebTime');
        if (!el) { clearInterval(eventTicker); eventTicker = null; return; }
        const left = target - eventNow();
        el.textContent = fmtCountdown(left);
        if (left <= 0 && Date.now() - lastEventRefresh > 3000) refreshEvent();
      };
      tick();
      eventTicker = setInterval(tick, 1000);
    }

    async function renderJonatmoq(main) {
      main.innerHTML = `
        <div class="page-title">Jo'natmoq</div>
        <div class="page-sub">Boshqa foydalanuvchiga gift, coin yoki case yuboring. Coin yuborishda 3% komissiya olinadi.</div>

        <div class="section-title">Nima yuboramiz?</div>
        <div class="type-tabs">
          <button class="type-tab active" data-type="coin" onclick="switchSendType('coin')">🪙 Coin</button>

    function switchSendType(type) {
      document.querySelectorAll('.type-tab').forEach(b => b.classList.toggle('active', b.dataset.type === type));
      document.getElementById('sendCoinBlock').style.display = type === 'coin' ? 'block' : 'none';
      document.getElementById('sendGiftBlock').style.display = type === 'gift' ? 'block' : 'none';
      document.getElementById('sendCaseBlock').style.display = type === 'case' ? 'block' : 'none';
    }

    function updateCommissionHint() {
      const amt = parseFloat(document.getElementById('sendCoinAmount').value) || 0;
      const commission = Math.round(amt * 0.03 * 100) / 100;
      const hint = document.getElementById('commissionHint');
      hint.textContent = amt > 0 ? `Komissiya: ${commission} coin — jami ${amt + commission} coin yechiladi` : '';
    }

    const ITEM_TYPE_LABELS = { coin: 'Coin', gift: 'Gift', case: 'Case' };

    function submitSend() {
      const msg = document.getElementById('sendMsg');
      msg.textContent = ''; msg.className = 'msg';

      const toUsername = document.getElementById('sendToUsername').value.trim();
      if (!toUsername) { msg.textContent = 'Username kiriting'; msg.classList.add('error'); return; }

      const type = document.querySelector('.type-tab.active').dataset.type;
      let body;

      if (type === 'coin') {
        const amount = parseFloat(document.getElementById('sendCoinAmount').value);
        if (!amount || amount <= 0) { msg.textContent = "Miqdorni to'g'ri kiriting"; msg.classList.add('error'); return; }
        body = { to_username: toUsername, amount };
      } else if (type === 'gift') {
        const inventory_id = document.getElementById('sendGiftSelect').value;
        if (!inventory_id) { msg.textContent = 'Gift tanlang'; msg.classList.add('error'); return; }
        body = { to_username: toUsername, inventory_id };
      } else {
        const inventory_id = document.getElementById('sendCaseSelect').value;
        if (!inventory_id) { msg.textContent = 'Case tanlang'; msg.classList.add('error'); return; }
        body = { to_username: toUsername, inventory_id };
      }

      openSendConfirmModal(type, body);
    }

      const body = { ...window.__pendingSendBody, is_anonymous: window.__pendingSendAnon };
      const url = `${API_BASE}/api/transfers/${type}`;

      const res = await fetch(url, {
